<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trợ giảng · Ghi nhận xét giọng nói</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: system-ui, sans-serif; background:#F8F2E9; color:#2F2638; margin:0; padding:18px; }
  .wrap { max-width:900px; margin:0 auto; }
  h1 { font-size:24px; margin:8px 0 14px; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  select, button { font:inherit; padding:9px 14px; border-radius:12px; border:1px solid #B08D57; background:#FFFCF6; color:#2F2638; }
  button.primary { background:#B08D57; color:#fff; border:none; cursor:pointer; }
  button:disabled { opacity:.5; }
  .row { background:#FFFCF6; border:1px solid rgba(176,141,87,.45); border-radius:16px; padding:14px 16px; margin-bottom:10px; }
  .meta { font-size:14px; color:#7D7183; margin-top:4px; }
  .msg { font-size:15px; margin-top:8px; }
  .ok { color:#5E8B6E; } .bad { color:#B05468; }
  audio { width:100%; margin-top:8px; }
  .top { display:flex; justify-content:space-between; font-size:15px; }
  a { color:#B08D57; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html">← Trang học sinh</a><span id="who"></span></div>
  <h1>Ghi nhận xét giọng nói cho học sinh</h1>
  <div class="bar">
    <select id="cls" onchange="render()"><option value="">Tất cả lớp</option><option value="FOUNDATION11">Foundation 11</option><option value="IELTS13">IELTS 13</option><option value="IELTS14">IELTS 14</option></select>
    <span class="meta">Hiện các bài làm trong 14 ngày gần nhất.</span>
  </div>
  <div id="list"><div class="meta">Đang tải…</div></div>
</div>

<script>
const SUPABASE_URL = 'https://sxnxbbosfyapmmkrhcdj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_OMyiSjOVcKOfRdZO9JwSZg_8XogOYkZ';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows = [], recorder = null, chunks = [], recStream = null, recTimer = null, session = null;

(async () => {
  const { data: { session: s } } = await db.auth.getSession();
  if (!s) { location.href = 'login.html?t=1'; return; }
  const { data: isStaff } = await db.rpc('is_staff');
  if (!isStaff) { await db.auth.signOut(); location.href = 'login.html?t=1'; return; }
  session = s;
  document.getElementById('who').textContent = s.user.email;
  load();
})();

function isoDaysAgo(n) { const d = new Date(Date.now() - n * 86400000); return d.toISOString().slice(0, 10); }

async function load() {
  const { data, error } = await db.from('daily_scores')
    .select('id, student_id, practice_id, practice_date, section, score, max_score, students(full_name, class_code)')
    .gte('practice_date', isoDaysAgo(14)).order('practice_date', { ascending: false }).limit(500);
  if (error) { document.getElementById('list').innerHTML = `<div class="bad">Không tải được: ${esc(error.message)}</div>`; return; }
  rows = data || [];
  render();
}

function render() {
  const cls = document.getElementById('cls').value;
  const list = rows.filter(r => !cls || (r.students && r.students.class_code === cls));
  document.getElementById('list').innerHTML = list.length ? list.map(r => `
    <div class="row" id="row-${esc(r.id)}">
      <b>${esc(r.students ? r.students.full_name : '—')}</b> · ${esc(r.students ? r.students.class_code : '')}
      <div class="meta">${esc(r.practice_date)} · ${esc(r.practice_id)} · ${esc(r.section || '')} · ${r.score}/${r.max_score}</div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <button onclick="startRec('${esc(r.id)}')" id="rec-${esc(r.id)}">🎙 Ghi âm nhận xét</button>
      </div>
      <div id="box-${esc(r.id)}"></div>
    </div>`).join('') : '<div class="meta">Chưa có bài làm nào trong 14 ngày gần nhất.</div>';
}

async function startRec(id) {
  if (recorder) { recorder.stop(); return; }
  const box = document.getElementById('box-' + id), btn = document.getElementById('rec-' + id);
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { box.innerHTML = `<div class="msg bad">Không dùng được micro: ${esc(e.message)}</div>`; return; }
  const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
  chunks = []; recStream = stream;
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  recorder.ondataavailable = ev => { if (ev.data.size) chunks.push(ev.data); };
  recorder.onstop = () => {
    clearTimeout(recTimer); recStream.getTracks().forEach(t => t.stop());
    const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
    recorder = null; btn.textContent = '🎙 Ghi lại';
    const url = URL.createObjectURL(blob);
    box.innerHTML = `<audio controls src="${url}"></audio>
      <div style="margin-top:8px;display:flex;gap:8px"><button class="primary" onclick="sendRec('${esc(id)}')">Gửi cho học sinh</button><button onclick="startRec('${esc(id)}')">Ghi lại</button></div>
      <div class="msg" id="msg-${esc(id)}"></div>`;
    window._pending = { id, blob };
  };
  recorder.start(); btn.textContent = '⏹ Dừng';
  box.innerHTML = '<div class="msg">Đang ghi… tự dừng sau 90 giây.</div>';
  recTimer = setTimeout(() => { if (recorder) recorder.stop(); }, 90000);
}

function blobToB64(blob) {
  return blob.arrayBuffer().then(buf => {
    const u = new Uint8Array(buf); let s = '';
    for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    return btoa(s);
  });
}

async function sendRec(id) {
  const msg = document.getElementById('msg-' + id);
  const pending = window._pending;
  if (!pending || pending.id !== id) { msg.innerHTML = '<span class="bad">Ghi âm lại rồi gửi.</span>'; return; }
  const r = rows.find(x => x.id === id); if (!r) return;
  msg.textContent = 'Đang gửi…';
  try {
    const res = await fetch('/api/voice-reply', {
      method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + session.access_token },
      body: JSON.stringify({ student_id: r.student_id, practice_id: r.practice_id, practice_date: r.practice_date, section: r.section, mime: pending.blob.type, audio: await blobToB64(pending.blob) })
    });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'Lỗi không rõ');
    msg.innerHTML = '<span class="ok">✓ Đã gửi. Học sinh sẽ thấy trong mục "Hôm nay".</span>';
    window._pending = null;
  } catch (e) {
    msg.innerHTML = `<span class="bad">Chưa gửi được: ${esc(e.message)}</span>`;
  }
}
</script>
</body>
</html>
