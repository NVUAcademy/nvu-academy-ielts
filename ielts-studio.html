<title>Pastel IELTS Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: a vintage salon — ivory paper, dusty pastel panels framed in gold double rules, arched gates, Bodoni headings over a Jost body */
:root{
  --bg:#F8F2E9; --paper:#FFFCF6; --ink:#2F2638; --muted:#7D7183; --gold:#B08D57; --gold-soft:#D9C49C;
  --line:color-mix(in srgb,var(--gold) 55%,transparent); --soft:#F2E9DC; --on-pastel:#2F2638;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 18px 40px -22px rgba(64,40,52,.35), 0 2px 6px -3px rgba(64,40,52,.18);
  --pink:#EBC7C9; --mint:#CBDCCB; --butter:#F0DFB6; --lilac:#D9CFE7; --sky:#C9DBE6; --peach:#F1D2BF;
  --good:#5E8B6E; --warn:#A97F2E; --bad:#B05468;
  --a1:var(--pink); --a2:var(--mint); --a3:var(--butter);
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Jost","Futura","Century Gothic",system-ui,sans-serif;
  --r:22px; --r-sm:14px; --fs:15px;
  --damask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27112%27%20height%3D%27112%27%20viewBox%3D%270%200%20112%20112%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23B08D57%27%20stroke-width%3D%271%27%20opacity%3D%27.32%27%3E%3Cpath%20d%3D%27M56%200L112%2056L56%20112L0%2056Z%27/%3E%3Cpath%20d%3D%27M56%2032c8%209%208%2017%200%2024c-8-7-8-15%200-24zM56%2080c8-9%208-17%200-24c-8%207-8%2015%200%2024zM32%2056c9-8%2017-8%2024%200c-7%208-15%208-24%200zM80%2056c-9-8-17-8-24%200c7%208%2015%208%2024%200z%27/%3E%3Ccircle%20cx%3D%2756%27%20cy%3D%2756%27%20r%3D%273%27/%3E%3Cpath%20d%3D%27M0%200c6%204%206%2010%200%2014M112%200c-6%204-6%2010%200%2014M0%20112c6-4%206-10%200-14M112%20112c-6-4-6-10%200-14%27/%3E%3C/g%3E%3Cg%20fill%3D%27%23B08D57%27%20opacity%3D%27.32%27%3E%3Ccircle%20cx%3D%2756%27%20cy%3D%2714%27%20r%3D%271.6%27/%3E%3Ccircle%20cx%3D%2756%27%20cy%3D%2798%27%20r%3D%271.6%27/%3E%3Ccircle%20cx%3D%2714%27%20cy%3D%2756%27%20r%3D%271.6%27/%3E%3Ccircle%20cx%3D%2798%27%20cy%3D%2756%27%20r%3D%271.6%27/%3E%3C/g%3E%3C/svg%3E");
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D1723; --paper:#271F2E; --ink:#F3EADF; --muted:#B5A8B4; --gold:#D3B47A; --gold-soft:#7E6A49; --soft:#30273A;
  --shadow:0 18px 40px -20px rgba(0,0,0,.7), 0 2px 6px -3px rgba(0,0,0,.5);
  --pink:#C99AA0; --mint:#A3BEA6; --butter:#D8C08A; --lilac:#B5A7CC; --sky:#A2BDCC; --peach:#D2A88F;
  --good:#9CCBA9; --warn:#E3C27A; --bad:#E59AAA; --damask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27112%27%20height%3D%27112%27%20viewBox%3D%270%200%20112%20112%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23D3B47A%27%20stroke-width%3D%271%27%20opacity%3D%27.16%27%3E%3Cpath%20d%3D%27M56%200L112%2056L56%20112L0%2056Z%27/%3E%3Cpath%20d%3D%27M56%2032c8%209%208%2017%200%2024c-8-7-8-15%200-24zM56%2080c8-9%208-17%200-24c-8%207-8%2015%200%2024zM32%2056c9-8%2017-8%2024%200c-7%208-15%208-24%200zM80%2056c-9-8-17-8-24%200c7%208%2015%208%2024%200z%27/%3E%3Ccircle%20cx%3D%2756%27%20cy%3D%2756%27%20r%3D%273%27/%3E%3Cpath%20d%3D%27M0%200c6%204%206%2010%200%2014M112%200c-6%204-6%2010%200%2014M0%20112c6-4%206-10%200-14M112%20112c-6-4-6-10%200-14%27/%3E%3C/g%3E%3Cg%20fill%3D%27%23D3B47A%27%20opacity%3D%27.16%27%3E%3Ccircle%20cx%3D%2756%27%20cy%3D%2714%27%20r%3D%271.6%27/%3E%3Ccircle%20cx%3D%2756%27%20cy%3D%2798%27%20r%3D%271.6%27/%3E%3Ccircle%20cx%3D%2714%27%20cy%3D%2756%27%20r%3D%271.6%27/%3E%3Ccircle%20cx%3D%2798%27%20cy%3D%2756%27%20r%3D%271.6%27/%3E%3C/g%3E%3C/svg%3E"); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1723; --paper:#271F2E; --ink:#F3EADF; --muted:#B5A8B4; --gold:#D3B47A; --gold-soft:#7E6A49; --soft:#30273A;
  --shadow:0 18px 40px -20px rgba(0,0,0,.7), 0 2px 6px -3px rgba(0,0,0,.5);
  --pink:#C99AA0; --mint:#A3BEA6; --butter:#D8C08A; --lilac:#B5A7CC; --sky:#A2BDCC; --peach:#D2A88F;
  --good:#9CCBA9; --warn:#E3C27A; --bad:#E59AAA; --damask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27112%27%20height%3D%27112%27%20viewBox%3D%270%200%20112%20112%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23D3B47A%27%20stroke-width%3D%271%27%20opacity%3D%27.16%27%3E%3Cpath%20d%3D%27M56%200L112%2056L56%20112L0%2056Z%27/%3E%3Cpath%20d%3D%27M56%2032c8%209%208%2017%200%2024c-8-7-8-15%200-24zM56%2080c8-9%208-17%200-24c-8%207-8%2015%200%2024zM32%2056c9-8%2017-8%2024%200c-7%208-15%208-24%200zM80%2056c-9-8-17-8-24%200c7%208%2015%208%2024%200z%27/%3E%3Ccircle%20cx%3D%2756%27%20cy%3D%2756%27%20r%3D%273%27/%3E%3Cpath%20d%3D%27M0%200c6%204%206%2010%200%2014M112%200c-6%204-6%2010%200%2014M0%20112c6-4%206-10%200-14M112%20112c-6-4-6-10%200-14%27/%3E%3C/g%3E%3Cg%20fill%3D%27%23D3B47A%27%20opacity%3D%27.16%27%3E%3Ccircle%20cx%3D%2756%27%20cy%3D%2714%27%20r%3D%271.6%27/%3E%3Ccircle%20cx%3D%2756%27%20cy%3D%2798%27%20r%3D%271.6%27/%3E%3Ccircle%20cx%3D%2714%27%20cy%3D%2756%27%20r%3D%271.6%27/%3E%3Ccircle%20cx%3D%2798%27%20cy%3D%2756%27%20r%3D%271.6%27/%3E%3C/g%3E%3C/svg%3E"); color-scheme:dark}
:root[data-palette="matcha"]{--a1:var(--mint);--a2:var(--butter);--a3:var(--peach)}
:root[data-palette="blueberry"]{--a1:var(--sky);--a2:var(--lilac);--a3:var(--pink)}
:root[data-palette="lemon"]{--a1:var(--butter);--a2:var(--peach);--a3:var(--sky)}
:root[data-palette="lavender"]{--a1:var(--lilac);--a2:var(--pink);--a3:var(--mint)}
:root[data-corners="pixel"]{--r:3px;--r-sm:2px}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs);line-height:1.55;letter-spacing:.1px;
  background-image:
    radial-gradient(90% 55% at 50% -8%, color-mix(in srgb,var(--a1) 45%,transparent), transparent 62%),
    radial-gradient(60% 50% at 0% 100%, color-mix(in srgb,var(--a2) 28%,transparent), transparent 70%),
    radial-gradient(60% 50% at 100% 100%, color-mix(in srgb,var(--a3) 28%,transparent), transparent 70%),
    radial-gradient(130% 100% at 50% 50%, transparent 55%, color-mix(in srgb,var(--gold) 16%,transparent) 100%),
    var(--damask);
  background-attachment:fixed;background-size:auto,auto,auto,auto,112px 112px}
#page-fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.shell{position:relative;z-index:1}
.shell::before{content:"";display:block;height:10px;margin:0 auto -8px;width:min(520px,80%);
  background:radial-gradient(circle,var(--gold) 0 2px,transparent 2.5px) center/22px 10px repeat-x,linear-gradient(90deg,transparent,var(--gold),transparent) center/100% 1px no-repeat;opacity:.7}
.win-bar::after{height:2px!important;background:linear-gradient(90deg,var(--gold),color-mix(in srgb,var(--gold) 45%,transparent) 55%,transparent)!important}
.gate-hero .crown{font-size:34px;color:var(--gold);line-height:1;text-shadow:0 2px 6px color-mix(in srgb,var(--gold) 40%,transparent);margin-bottom:-6px;position:relative}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.15;font-weight:500}
p{margin:0}
a{color:inherit;text-decoration-color:var(--gold);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:600}

/* ---------- shell ---------- */
.shell{max-width:1240px;margin:0 auto;padding-block:20px 48px;padding-inline:16px;display:flex;flex-direction:column;gap:22px}
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);outline:1px solid var(--line);outline-offset:-6px;border-radius:var(--r);box-shadow:var(--shadow);padding:14px 20px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;flex:none;border-radius:50% 50% 8px 8px;background:radial-gradient(circle at 40% 30%,color-mix(in srgb,var(--a1) 60%,#fff),var(--a1));border:1px solid var(--gold);outline:1px solid var(--gold);outline-offset:3px;display:grid;place-items:center;font-size:22px;color:#8a6a2f;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.brand h1{font-family:var(--display);font-weight:500;font-size:clamp(20px,3vw,26px);letter-spacing:.2px}
.brand small{display:block;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);font-weight:600}
.topbar .spacer{flex:1}
.who{display:flex;align-items:center;gap:10px;font-weight:500}
.who img{width:32px;height:32px;border-radius:50%;border:1px solid var(--gold)}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px;align-items:start}
.layout.top{grid-template-columns:minmax(0,1fr)}
.nav{display:flex;flex-direction:column;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px)}
.layout.top .nav{flex-direction:row;flex-wrap:wrap;position:static;justify-content:center}
.nav button{display:flex;align-items:center;gap:10px;border:1px solid transparent;background:none;border-radius:999px;padding:8px 14px;font-weight:500;cursor:pointer;text-align:left;transition:background .2s,border-color .2s}
.nav button:hover{background:var(--soft)}
.nav button[aria-current="page"]{background:var(--a1);color:var(--on-pastel);border-color:var(--gold)}
.nav .pip{width:9px;height:9px;border-radius:50%;border:1px solid var(--gold);flex:none}
.nav .lbl{font-size:10px;letter-spacing:3px;color:var(--gold);font-weight:600;padding:8px 14px 4px;text-transform:uppercase}
.layout.top .nav .lbl{display:none}
main{min-width:0;display:flex;flex-direction:column;gap:22px}
@media (max-width:780px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .nav{flex-direction:row;overflow-x:auto;position:static;padding:8px}
  .nav button{white-space:nowrap}
  .nav .lbl{display:none}
}

/* ---------- framed panels ---------- */
.win{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.win::after{content:"";position:absolute;inset:5px;border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);border-radius:calc(var(--r) - 4px);pointer-events:none}
.win-bar{display:flex;align-items:center;gap:12px;padding:16px 22px 12px;flex-wrap:wrap;position:relative}
.win-bar::before{content:"";width:28px;height:28px;flex:none;border-radius:50% 50% 4px 4px;background:var(--wc,var(--a1));border:1px solid var(--gold)}
.win-bar h2,.win-bar h3{font-family:var(--display);font-weight:500;font-size:21px;letter-spacing:.1px}
.win-bar::after{content:"";position:absolute;left:22px;right:22px;bottom:0;height:1px;background:linear-gradient(90deg,var(--gold),color-mix(in srgb,var(--gold) 10%,transparent))}
.dots{display:none}
.win-bar .grow{flex:1}
.win-body{padding:18px 22px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.c-pink{--wc:var(--pink)}.c-mint{--wc:var(--mint)}.c-butter{--wc:var(--butter)}.c-lilac{--wc:var(--lilac)}.c-sky{--wc:var(--sky)}.c-peach{--wc:var(--peach)}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid-2{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.pixel{font-family:var(--display);font-style:italic;font-size:19px;line-height:1.1;font-variant-numeric:lining-nums tabular-nums}
.hello{font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(30px,4.4vw,46px);line-height:1.05}
.welcome-card{padding:26px 28px!important;gap:10px!important;background:linear-gradient(135deg,color-mix(in srgb,var(--wc,var(--a1)) 70%,var(--paper)),var(--paper) 75%)!important;color:var(--ink)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--gold);background:var(--paper);border-radius:999px;padding:8px 18px;font-weight:600;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s,transform .15s;white-space:nowrap}
.btn:hover{background:var(--soft);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--ink) 85%,var(--gold))}
.btn.alt{background:var(--a2);color:var(--on-pastel)}
.btn.sm{padding:5px 12px;font-size:11px;letter-spacing:1.2px}
.btn.ghost{border-color:transparent;background:none;text-decoration:underline;padding:2px 6px;letter-spacing:.5px;text-transform:none;font-weight:500}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=url],input[type=password],select,textarea{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);padding:9px 12px;font-weight:400;font-size:15px;letter-spacing:normal;text-transform:none;color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 20%,transparent);outline:none}
textarea{min-height:110px;resize:vertical;line-height:1.6}
.chk{display:inline-flex;align-items:center;gap:8px;font-weight:500;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--gold)}
.form-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.form-grid .full{grid-column:1/-1}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 15px;font-weight:600;cursor:pointer;font-size:11px;letter-spacing:1.4px;text-transform:uppercase}
.tabs button[aria-pressed="true"]{background:var(--a2);color:var(--on-pastel);border-color:var(--gold)}

/* ---------- chips, bars, lists ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 11px;font-size:10.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;background:var(--paper);white-space:nowrap}
.chip.good{background:var(--mint);color:var(--on-pastel)}
.chip.warn{background:var(--butter);color:var(--on-pastel)}
.chip.bad{background:var(--pink);color:var(--on-pastel)}
.chip.info{background:var(--sky);color:var(--on-pastel)}
.say-btn{border:1px solid var(--gold);background:var(--paper);color:var(--ink);border-radius:999px;min-width:30px;height:30px;padding:0 9px;cursor:pointer;font-size:13px;line-height:1;display:inline-flex;align-items:center;justify-content:center;gap:4px;vertical-align:middle;transition:background .2s,transform .1s}
.say-btn:hover{background:color-mix(in srgb,var(--a3) 50%,var(--paper))}
.say-btn:active{transform:scale(.94)}
.face .say-btn{background:rgba(255,255,255,.7);color:var(--on-pastel);border-color:var(--on-pastel)}
.face .say-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip.pos{background:none;border-color:var(--gold);color:var(--gold);text-transform:lowercase;letter-spacing:.6px;font-style:italic;font-family:var(--display);font-size:13px;font-weight:500}
.face .chip.pos{color:var(--on-pastel);border-color:var(--on-pastel)}
.chip.lilac{background:var(--lilac);color:var(--on-pastel)}
.bar{height:10px;border:1px solid var(--line);border-radius:999px;background:var(--soft);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--bc,var(--a2)),color-mix(in srgb,var(--bc,var(--a2)) 70%,var(--gold)));border-radius:999px;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:baseline}
.bar-row .bar{grid-column:1/-1}
.pct{font-family:var(--display);font-style:italic;font-size:26px;line-height:1}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.item{display:flex;gap:12px;align-items:center;padding:12px 6px;border-top:1px solid color-mix(in srgb,var(--gold) 22%,transparent);flex-wrap:wrap;min-width:0}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:180px}
.item .main b{display:block;font-weight:600}
.item.click{cursor:pointer;border-radius:var(--r-sm);transition:background .2s}
.item.click:hover{background:var(--soft)}
.empty{border:1px dashed var(--line);border-radius:var(--r-sm);padding:26px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center;font-style:italic;font-family:var(--display);font-size:17px}
.stat{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;background:var(--paper);min-width:0;position:relative}
.stat::before{content:"";position:absolute;left:16px;top:0;width:24px;height:2px;background:var(--gold)}
.stat .n{font-family:var(--display);font-size:34px;line-height:1.05;font-variant-numeric:lining-nums tabular-nums}
.stat .k{font-size:10.5px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid color-mix(in srgb,var(--gold) 20%,transparent);white-space:nowrap}
th{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;font-weight:600;color:var(--muted);background:var(--soft)}
tr:last-child td{border-bottom:0}
td.wrap{white-space:normal;min-width:180px}

.avatar-ring .hero-cv{width:100%;height:100%;border:0;outline:0;border-radius:50%;box-shadow:none}
.hero-cv.mini-hero{display:inline-block;width:30px;height:30px;vertical-align:middle;margin-right:8px;border-radius:50%;outline:0;box-shadow:none}
.post .av{overflow:hidden}
.post .av .hero-cv{width:100%;height:100%;border:0;outline:0;border-radius:50%;box-shadow:none}
.welcome-wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
.welcome-wrap .hero-cv{width:clamp(96px,16vw,140px);height:auto}
.hero-card .hero-cv{width:120px;height:auto}
.fighter .hero-cv{width:clamp(100px,22vw,150px);height:auto}
.hit .hero-cv{animation:hit .45s}
.me.lunge .hero-cv{animation:lunge .45s}

/* ---------- speaking timer ---------- */
.timer{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 20px;border:1px solid var(--line);border-radius:200px 200px var(--r) var(--r);background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--a3) 45%,var(--paper)),var(--paper) 70%)}
.timer .digits{font-family:var(--display);font-size:clamp(72px,15vw,116px);line-height:.9;font-variant-numeric:lining-nums tabular-nums;font-weight:400}
.timer .phase{font-weight:600;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
.cue{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);padding:16px 18px}
.cue .prose{font-size:16px}
details.cue[open]{box-shadow:var(--shadow)}
summary::marker{color:var(--gold)}

/* ---------- hub ---------- */
.post{display:flex;gap:12px;align-items:flex-start}
.post .av{width:36px;height:36px;flex:none;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-family:var(--display);font-style:italic;font-size:17px;color:var(--on-pastel)}
.post .bubble{flex:1;min-width:0;border:1px solid var(--line);border-radius:4px var(--r-sm) var(--r-sm) var(--r-sm);padding:10px 14px;background:var(--paper)}
.post.t .bubble{background:color-mix(in srgb,var(--a1) 30%,var(--paper))}

/* ---------- modal, toast ---------- */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,#1b1320 45%,transparent);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:max(28px,env(safe-area-inset-top,0px)) 16px 28px;overflow:auto;z-index:20}
.overlay .win{width:100%;max-width:680px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:999px;font-weight:500;z-index:30;max-width:calc(100% - 32px);border:1px solid var(--gold);box-shadow:var(--shadow)}
.notice{border:1px solid var(--gold);border-radius:var(--r-sm);padding:12px 16px;background:color-mix(in srgb,var(--butter) 70%,var(--paper));color:var(--on-pastel);font-weight:500}
.order-row{display:flex;align-items:center;gap:8px;padding:9px 6px;border-top:1px solid color-mix(in srgb,var(--gold) 22%,transparent)}
.order-row:first-child{border-top:0}
.order-row .name{flex:1;font-weight:500}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;cursor:pointer;background:var(--paper);display:flex;flex-direction:column;gap:6px;align-items:center;font-size:12px;font-weight:500}
.swatch[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.swatch span{display:flex}
.swatch span i{width:20px;height:20px;border:1px solid var(--gold);margin-left:-5px;border-radius:50%}
.swatch span i:first-child{margin-left:0}
video{max-width:100%;border:1px solid var(--gold);border-radius:var(--r-sm);background:#000}
</style>

<div id="app" class="shell" aria-live="polite">
  <div class="gate-hero"><span class="crown" aria-hidden="true">♛</span><h1>IELTS <span>Studio</span></h1><p class="pixel muted">loading your classroom…</p></div>
</div>
<canvas id="page-fx" aria-hidden="true"></canvas>
<div id="greet-root"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* =========================================================
   Pastel IELTS Studio — teacher & student hub
   Data lives in the artifact's shared database.
   ========================================================= */
const S = {
  db:null, user:null, assets:null, uid:null, me:null, isOwner:false, fatal:null, ready:false,
  d:{classes:[],lessons:[],vocab:[],prompts:[],samples:[],homework:[],settings:null,students:{},chat:{},subs:{},grades:{},fees:null,mySub:null,myGrade:null},
  ui:{gate:null, tab:'home', classId:'', contentTab:'lessons', modal:null, confirm:null, hwSel:null, studentSel:null,
      vocabMode:'list', vocabTopic:'', fc:null, match:null, spell:null, spPart:'2', spPrompt:null, timer:{phase:'idle',left:0,total:0},
      hubLesson:'', feeMonth:new Date().toLocaleDateString('en-CA').slice(0,7), previewClass:'', ttab:'dash'}
};
const DEFAULTS = {
  title:'IELTS Studio', welcome:'Small steps every day. Today’s goal: finish your homework and master five new words.',
  palette:'strawberry', nav:'side', corners:'soft',
  order:['home','schedule','homework','vocab','quest','speaking','writing','hub','errors','progress'], hidden:[],
  points:{latePct:50, vocabPer:10, vocabPts:1, commentPts:0.5, commentCap:10, questPts:1}
};
const STUDENT_SECTIONS = {
  home:['Home','pink'], schedule:['Schedule','sky'], homework:['Homework','butter'], vocab:['Vocabulary','mint'], quest:['Knight’s Quest','lilac'],
  speaking:['Speaking','lilac'], writing:['Writing samples','peach'], hub:['Lesson hub','sky'], errors:['Error log','pink'], progress:['My progress','mint']
};
const TEACHER_SECTIONS = {
  dash:['Dashboard','pink'], classes:['Classes','sky'], vocab:['Vocabulary bank','mint'], content:['Lessons & content','peach'], homework:['Homework & grading','butter'],
  hub:['Lesson hub','sky'], students:['Students','lilac'], fees:['Fees','peach'], layout:['Layout & rules','pink']
};
const SCHEMAS = {
  classes:{label:'class', fields:[
    {k:'name',l:'Class name',t:'text',req:1},{k:'level',l:'Level / target band',t:'text'},
    {k:'schedule',l:'Schedule (e.g. Mon & Thu, 19:00)',t:'text'},{k:'code',l:'Join code students type',t:'text',req:1},
    {k:'fee',l:'Monthly fee (VND)',t:'number'},{k:'color',l:'Card colour',t:'select',opts:['pink','mint','butter','lilac','sky','peach']}]},
  lessons:{label:'lesson', fields:[
    {k:'classId',l:'Class',t:'class',req:1},{k:'title',l:'Lesson title',t:'text',req:1},{k:'date',l:'Date',t:'date'},
    {k:'time',l:'Time',t:'text'},{k:'topic',l:'Skill / topic',t:'text'},{k:'notes',l:'Notes for students',t:'textarea',full:1},
    {k:'done',l:'Lesson completed (counts toward class progress)',t:'checkbox',full:1}]},
  vocab:{label:'word', fields:[
    {k:'classId',l:'Class',t:'class',req:1},{k:'word',l:'Word',t:'text',req:1},{k:'pos',l:'Word type',t:'select',opts:['','noun','verb','adjective','adverb','noun (plural)','phrasal verb','verb phrase','noun phrase','adjective phrase','adjective, verb','adjective, adverb','preposition','conjunction','phrase']},
    {k:'meaning',l:'Meaning',t:'text',req:1},{k:'topic',l:'Topic',t:'text'},{k:'example',l:'Example sentence',t:'textarea',full:1}]},
  prompts:{label:'speaking prompt', fields:[
    {k:'classId',l:'Class',t:'class',req:1},{k:'part',l:'Speaking part',t:'select',opts:['1','2','3']},
    {k:'text',l:'Prompt (for Part 2, put the cue points on new lines)',t:'textarea',req:1,full:1}]},
  samples:{label:'writing sample', fields:[
    {k:'classId',l:'Class',t:'class',req:1},{k:'task',l:'Task',t:'select',opts:['Writing Task 1','Writing Task 2','Speaking']},
    {k:'band',l:'Band score',t:'text'},{k:'question',l:'Question',t:'textarea',req:1,full:1},{k:'body',l:'Model answer',t:'textarea',req:1,full:1}]},
  homework:{label:'homework', fields:[
    {k:'classId',l:'Class',t:'class',req:1},{k:'title',l:'Title',t:'text',req:1},
    {k:'type',l:'Type',t:'select',opts:['Writing','Speaking video','Vocabulary','Reading','Listening','Other']},
    {k:'due',l:'Due date',t:'date',req:1},{k:'points',l:'Points for on-time submission',t:'number'},
    {k:'instructions',l:'Instructions',t:'textarea',full:1}]}
};

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today = () => new Date().toLocaleDateString('en-CA');
const localDate = iso => iso ? new Date(iso).toLocaleDateString('en-CA') : '';
const fmtDate = d => { if(!d) return '—'; const x=new Date(d+'T00:00'); return isNaN(x)?d:x.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}); };
const fmtWhen = iso => iso ? new Date(iso).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
const vnd = n => (Number(n)||0).toLocaleString('vi-VN')+' ₫';
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const clone = o => JSON.parse(JSON.stringify(o ?? {}));
const safeUrl = u => /^https?:\/\//i.test(u||'') ? u : '';
const blobUrl = id => /^https?:/i.test(id||'') ? id : '/_blob/'+id;
const fmtSize = n => n>=1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1,Math.round((n||0)/1024))+' KB';
const fileIcon = (name,type) => /\.docx?$/i.test(name)||/word/i.test(type) ? 'W' : /\.pdf$/i.test(name)||/pdf/i.test(type) ? 'PDF' : /\.pptx?$/i.test(name)||/presentation/i.test(type) ? 'P' : /\.xlsx?$/i.test(name)||/sheet/i.test(type) ? 'X' : /^image\//.test(type||'') ? 'IMG' : /^audio\//.test(type||'') ? '♪' : '📎';
const attList = (atts, title='Materials') => (atts&&atts.length) ? `<div class="stack"><span class="eyebrow">${title}</span><div class="att-list">${atts.map(a=>`<a class="att" href="${esc(blobUrl(a.ref))}" target="_blank" rel="noopener"><span class="att-ic">${fileIcon(a.name,a.type)}</span><span class="att-name">${esc(a.name)}</span><span class="small muted">${fmtSize(a.size)}</span><span class="att-go">Open ↗</span></a>`).join('')}</div></div>` : '';
const posChip = p => p ? `<span class="chip pos">${esc(p)}</span>` : '';
const words = t => (t||'').trim().split(/\s+/).filter(Boolean).length;
const ls = { get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}} };
const settings = () => { const o={...DEFAULTS, ...(S.d.settings||{}), points:{...DEFAULTS.points, ...((S.d.settings||{}).points||{})}};
  o.order=[...o.order.filter(k=>STUDENT_SECTIONS[k]), ...DEFAULTS.order.filter(k=>!o.order.includes(k))]; return o; };
const byClass = (arr,cid) => cid ? arr.filter(x=>x.classId===cid) : arr;
const classById = id => S.d.classes.find(c=>c.id===id);
const bar = (p,color) => `<div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%;${color?`--bc:var(--${color})`:''}"></i></div>`;
const win = (title,body,color='',extra='',tag='h2') => `<section class="win ${color?'c-'+color:''}"><header class="win-bar"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><${tag}>${title}</${tag}><span class="grow"></span>${extra}</header><div class="win-body">${body}</div></section>`;
const empty = (msg,btn='') => `<div class="empty"><span>${msg}</span>${btn}</div>`;
let toastT; function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}

/* ---------- database plumbing ---------- */
const queues = {};
function errMsg(e){
  const c=e&&e.code;
  if(c==='invalid_argument') return 'Not saved: this account can’t write here. Ask your teacher to share the page with you as an Editor.';
  if(c==='quota_exceeded') return 'Not saved: storage is full. Delete some old items and try again.';
  if(c==='resource_exhausted') return 'Too many saves at once. Wait a moment and try again.';
  return 'Not saved: connection problem. Try again in a moment.';
}
function writeDoc(path, body){
  if(S.ui.gate==='preview'){ toast('Preview mode: nothing is saved.'); return Promise.resolve(); }
  const prev = queues[path] || Promise.resolve();
  const p = prev.then(()=>S.db.doc(path).set(body));
  queues[path] = p.catch(()=>{});
  return p.catch(e=>{ toast(errMsg(e)); throw e; });
}
function delDoc(path){
  const prev = queues[path] || Promise.resolve();
  const p = prev.then(()=>S.db.doc(path).delete());
  queues[path] = p.catch(()=>{});
  return p.catch(e=>{ toast(errMsg(e)); throw e; });
}
function subCol(name, onArr){
  S.db.collection(name).onSnapshot(snap=>{ onArr(snap.docs.map(d=>({id:d.id,...d.data()}))); schedule(); }, e=>console.warn(name,e));
}
function subDoc(path, onData){
  S.db.doc(path).onSnapshot(snap=>{ onData(snap.exists?snap.data():null); schedule(); }, e=>console.warn(path,e));
}
const toMap = arr => Object.fromEntries(arr.map(x=>[x.id,x]));

/* ---------- boot ---------- */
async function boot(){
  if(!window.claude || !window.claude.use){ S.fatal='open'; return render(); }
  const [db,user] = await Promise.all([claude.use('db'), claude.use('user')]);
  if(!db){ S.fatal='nodb'; return render(); }
  S.db=db; S.user=user;
  S.me = user ? await user.me() : null;
  S.uid = S.me ? S.me.id : null;
  S.isOwner = S.me ? !!S.me.isOwner : false;
  claude.use('assets').then(a=>{S.assets=a; schedule();});
  const sortBy = k => (a,b)=>String(a[k]||'').localeCompare(String(b[k]||''));
  subCol('classes', a=>S.d.classes=a.sort(sortBy('name')));
  subCol('lessons', a=>S.d.lessons=a.sort((x,y)=>(x.date||'').localeCompare(y.date||'')||(x.time||'').localeCompare(y.time||'')));
  subCol('vocab', a=>S.d.vocab=a.sort(sortBy('word')));
  subCol('prompts', a=>S.d.prompts=a);
  subCol('samples', a=>S.d.samples=a);
  subCol('homework', a=>S.d.homework=a.sort((x,y)=>(y.due||'').localeCompare(x.due||'')));
  subCol('students', a=>S.d.students=toMap(a));
  subCol('chat', a=>S.d.chat=toMap(a));
  subDoc('settings/site', d=>{S.d.settings=d; applyLook();});
  if(S.isOwner){
    subCol('subs', a=>S.d.subs=toMap(a));
    subCol('grades', a=>S.d.grades=toMap(a));
    if(S.uid) subDoc(`data/users/${S.uid}/fees`, d=>S.d.fees=d||{});
  } else if(S.uid){
    subDoc(`subs/${S.uid}`, d=>S.d.mySub=d);
    subDoc(`grades/${S.uid}`, d=>S.d.myGrade=d);
  }
  S.ready=true;
  const g = ls.get('gate',null);
  if(g==='teacher' && S.isOwner) S.ui.gate='teacher';
  else if(g==='student' && !S.isOwner && S.uid) S.ui.gate='student';
  S.ui.tab = S.ui.gate==='teacher' ? 'dash' : 'home';
  applyLook(); render();
}
function applyLook(){
  const s=settings(), root=document.documentElement;
  root.dataset.palette=s.palette; root.dataset.corners=s.corners;
  root.style.setProperty('--fs', (ls.get('fs',15))+'px');
}
let rq=false; function schedule(){ if(rq) return; rq=true; requestAnimationFrame(()=>{rq=false; render();}); }

/* ---------- student-side derived data ---------- */
function myStudent(){
  if(S.ui.gate==='preview') return {name:'Preview student', classIds:S.ui.previewClass?[S.ui.previewClass]:[], avatar:S.ui.previewAvatar||null};
  return S.d.students[S.uid] || null;
}
function subOf(uid){
  if(uid===S.uid && S.ui.gate==='preview') return S.d.previewSub||{};
  return uid===S.uid && !S.isOwner ? (S.d.mySub||{}) : (S.d.subs[uid]||{}); }
function gradeOf(uid){ return uid===S.uid && !S.isOwner ? (S.d.myGrade||{}) : (S.d.grades[uid]||{}); }
function hwStatus(hw, sub, grade){
  const it = (sub.items||{})[hw.id];
  if(it){
    if(grade && (grade.items||{})[hw.id]) return 'graded';
    return (hw.due && localDate(it.submittedAt) > hw.due) ? 'late' : 'submitted';
  }
  return (hw.due && today() > hw.due) ? 'missing' : 'open';
}
const STATUS_CHIP = {graded:['Graded','lilac'],submitted:['Submitted','good'],late:['Late','warn'],missing:['Missing','bad'],open:['To do','info']};
const chip = st => `<span class="chip ${STATUS_CHIP[st][1]}">${STATUS_CHIP[st][0]}</span>`;
function postsBy(uid){ return ((S.d.chat[uid]||{}).posts)||[]; }
function studentProgress(uid, cid){
  const sub=subOf(uid), grade=gradeOf(uid);
  const hws=byClass(S.d.homework,cid), done=hws.filter(h=>['submitted','late','graded'].includes(hwStatus(h,sub,grade))).length;
  const voc=byClass(S.d.vocab,cid), mastered=voc.filter(v=>(sub.mastered||[]).includes(v.id)).length;
  const parts=[]; if(hws.length) parts.push(done/hws.length); if(voc.length) parts.push(mastered/voc.length);
  const overall = parts.length ? Math.round(parts.reduce((a,b)=>a+b,0)/parts.length*100) : 0;
  return {hwDone:done, hwTotal:hws.length, mastered, vocTotal:voc.length, overall};
}
function classProgress(cid){ const ls_=byClass(S.d.lessons,cid); return {done:ls_.filter(l=>l.done).length,total:ls_.length,p:pct(ls_.filter(l=>l.done).length,ls_.length)}; }
function pointsFor(uid, classIds){
  const r=settings().points, sub=subOf(uid), grade=gradeOf(uid);
  let hw=0;
  S.d.homework.filter(h=>classIds.includes(h.classId)).forEach(h=>{
    const st=hwStatus(h,sub,grade), p=Number(h.points)||0;
    if(st==='late') hw+=p*(Number(r.latePct)||0)/100;
    else if(st==='submitted'||st==='graded'){
      const it=sub.items[h.id]; hw += (h.due && localDate(it.submittedAt)>h.due) ? p*(Number(r.latePct)||0)/100 : p;
    }
  });
  const vocab = Math.floor((sub.mastered||[]).length/(Number(r.vocabPer)||10))*(Number(r.vocabPts)||0);
  const comments = Math.min(postsBy(uid).length*(Number(r.commentPts)||0), Number(r.commentCap)||0);
  const bonus = (grade.bonus||[]).reduce((a,b)=>a+(Number(b.pts)||0),0);
  const quest = Math.max(0,(questOf(sub).level||1)-1)*(Number(r.questPts)||0);
  const total = Math.round((hw+vocab+comments+bonus+quest)*10)/10;
  return {hw:Math.round(hw*10)/10, vocab, comments:Math.round(comments*10)/10, bonus, quest, total};
}
function curClass(){
  const st=myStudent(); const ids=(st&&st.classIds)||[];
  if(!ids.includes(S.ui.classId)) S.ui.classId = ids[0]||'';
  return S.ui.classId;
}
async function saveMySub(mut){
  const preview = S.ui.gate==='preview';
  const base = clone((preview ? S.d.previewSub : S.d.mySub) || {items:{},mastered:[],errlog:[],games:{}});
  base.items ||= {}; base.mastered ||= []; base.errlog ||= []; base.games ||= {};
  mut(base);
  if(preview){ S.d.previewSub=base; render(); if(!S.ui.previewNote){ S.ui.previewNote=1; toast('Preview: progress is kept until you leave preview, and never saved.'); } return; }
  S.d.mySub = base; render();
  await writeDoc(`subs/${S.uid}`, base).catch(()=>{});
}

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  const app=$('#app');
  // keep what people were typing across live re-renders
  const keep={}; app.querySelectorAll('input[id],textarea[id],select[id]').forEach(el=>{ keep[el.id]= el.type==='checkbox'?el.checked:el.value; });
  const act=document.activeElement, actId=act&&act.id, sel=act&&typeof act.selectionStart==='number'?[act.selectionStart,act.selectionEnd]:null;
  app.innerHTML = view();
  Object.entries(keep).forEach(([id,v])=>{ const el=document.getElementById(id); if(el && !el.dataset.fresh){ if(el.type==='checkbox') el.checked=v; else if(el.type!=='file') el.value=v; } });
  if(actId){ const el=document.getElementById(actId); if(el){ el.focus({preventScroll:true}); if(sel&&el.setSelectionRange) try{el.setSelectionRange(sel[0],sel[1])}catch{} } }
  updateTimer(); drawSprites(); fxStart();
}
function view(){
  if(S.fatal==='open') return gateHero('This classroom runs inside claude.ai. Open the link there to sign in.');
  if(S.fatal==='nodb') return gateHero('The classroom database could not load in this view. Reload the page while signed in to claude.ai.');
  if(!S.ready) return gateHero('loading your classroom…');
  if(!S.ui.gate) return gateView();
  if(S.ui.gate==='teacher') return teacherShell();
  const st=myStudent();
  if(S.ui.gate==='student' && (S.ui.forceJoin || !st || !(st.classIds||[]).length)) return joinView();
  return studentShell();
}
function gateHero(msg){ return `<div class="gate-hero"><span class="crown" aria-hidden="true">♛</span><h1>IELTS <span>Studio</span></h1><p class="pixel muted">${esc(msg)}</p></div>`; }
function topbar(sub, right=''){
  const s=settings();
  const stv = (S.ui.gate==='student'||S.ui.gate==='preview') ? myStudent() : null;
  const img = stv && heroOf(stv) ? `<button class="avatar-ring" data-a="hero-change" title="Change your hero" aria-label="Change your hero" style="cursor:pointer;padding:0">${heroCv(stv.avatar)}</button>` : S.me ? `<img src="${esc(S.me.avatarUrl)}" alt="">` : '';
  return `<header class="topbar"><div class="brand"><div class="logo" aria-hidden="true">⚜</div><div><h1>${esc(s.title)}</h1><small>${esc(sub)}</small></div></div>
  <span class="spacer"></span>${right}

function sVocab(cid){
  const voc=byClass(S.d.vocab,cid), sub=subOf(S.uid), mastered=sub.mastered||[];
  const topics=[...new Set(voc.map(v=>v.topic).filter(Boolean))];
  let pool = S.ui.vocabTopic ? voc.filter(v=>v.topic===S.ui.vocabTopic) : voc;
  if(S.ui.onlyNew) pool = pool.filter(v=>!mastered.includes(v.id));
  const modes=[['list','Word list'],['cards','Flashcards'],['quiz','Practice quiz'],['gap','Fill the gap'],['speed','Speed round'],['match','Match game'],['spell','Spell it']];
  const head = `<div class="row between"><div class="tabs">${modes.map(([k,l])=>`<button data-a="vmode" data-v="${k}" aria-pressed="${S.ui.vocabMode===k}">${l}</button>`).join('')}</div>
    <div class="row"><select id="v-topic" data-a-change="vtopic" aria-label="Topic" style="width:auto"><option value="">All topics</option>${topics.map(t=>`<option ${t===S.ui.vocabTopic?'selected':''}>${esc(t)}</option>`).join('')}</select>
    <label class="chk small"><input type="checkbox" id="v-new" data-a-change="vnew" ${S.ui.onlyNew?'checked':''} data-fresh="1"> Only words I’m still learning</label>
    <span class="chip good">${voc.filter(v=>mastered.includes(v.id)).length}/${voc.length} mastered</span></div></div>`;
  let body='';
  if(!pool.length) body=empty(S.ui.onlyNew&&voc.length?'You’ve mastered every word here. Untick the filter to revise them all.':'No words here yet. Your teacher adds vocabulary for each class.');
  else if(S.ui.vocabMode==='list') body=`<p class="small muted">Press 🔊 to hear a word or sentence. Listen, then say it aloud 2 times.</p><div class="tbl-wrap"><table><thead><tr><th>Word</th><th>Meaning</th><th>Example</th><th>Status</th></tr></thead><tbody>${pool.map(v=>`<tr><td>${sayBtn(v.word,'🔊','Hear the word')} <b>${esc(v.word)}</b> ${posChip(v.pos)}</td><td class="wrap">${esc(v.meaning)}</td><td class="wrap muted">${v.example?sayBtn(v.example,'🔊','Hear the sentence')+' ':''}${esc(v.example||'')}</td><td>${mastered.includes(v.id)?'<span class="chip good">Mastered</span>':`<button class="btn sm" data-a="master" data-v="${esc(v.id)}">I know it</button>`}</td></tr>`).join('')}</tbody></table></div>`;
  else if(S.ui.vocabMode==='cards') body=flashView(pool,mastered);
  else if(S.ui.vocabMode==='quiz') body=quizView(pool,voc,'quiz');
  else if(S.ui.vocabMode==='gap') body=quizView(pool,voc,'gap');
  else if(S.ui.vocabMode==='speed') body=speedView(pool,voc,sub);
  else if(S.ui.vocabMode==='match') body=matchView(pool,sub);
  else body=spellView(pool);
  return win('Vocabulary', head+body,'mint');
}
function flashView(pool, mastered){
  let fc=S.ui.fc; if(!fc || !fc.deck.every(id=>pool.some(v=>v.id===id)) || !pool.every(v=>fc.deck.includes(v.id)) || fc.i>=fc.deck.length){ fc=S.ui.fc={deck:shuffle(pool.map(v=>v.id)),i:0,flip:false}; }
  const v=pool.find(x=>x.id===fc.deck[fc.i]);
  return `<p class="muted small" style="text-align:center">Card ${fc.i+1} of ${fc.deck.length} · tap the card to flip · press 🔊 and say the word aloud 2 times</p>
  <div class="flash ${fc.flip?'flipped':''}" data-a="flip" role="button" tabindex="0" aria-label="Flip card"><div class="flash-in">
    <div class="face"><span class="w">${esc(v.word)}</span>${posChip(v.pos)}<div class="say-row">${sayBtn(v.word,'🔊 Listen','Hear the word')}<button class="say-btn" data-a="say2" data-t="${esc(v.word)}" title="Hear it twice and repeat">🔁 Repeat after me</button></div></div>
    <div class="face back">${posChip(v.pos)}<b style="font-size:20px">${esc(v.meaning)}</b>${v.example?`<i>${esc(v.example)}</i>`:''}<div class="say-row">${sayBtn(v.word,'🔊 Word','Hear the word')}${v.example?sayBtn(v.example,'🔊 Sentence','Hear the sentence'):''}</div></div></div></div>
  <div class="row" style="justify-content:center"><button class="btn" data-a="fc-next" data-v="again">Again</button><button class="btn primary" data-a="fc-next" data-v="know">${mastered.includes(v.id)?'Know it ✓':'I know it'}</button></div>`;
}
function matchView(pool, sub){
  let m=S.ui.match;
  if(!m){ const pick=shuffle(pool.map(v=>v.id)).slice(0,Math.min(6,pool.length)); m=S.ui.match={ids:pick,left:shuffle(pick),right:shuffle(pick),sel:null,ok:[],bad:null,start:Date.now(),miss:0,end:null}; }
  const best=(sub.games||{}).matchBest;
  if(m.end) return `<div class="empty"><span class="pixel" style="font-size:40px">${m.end}s</span><span>Matched ${m.ids.length} pairs with ${m.miss} mistake${m.miss===1?'':'s'}.${best?` Best time: ${best}s.`:''}</span><button class="btn primary" data-a="match-new">Play again</button></div>`;
  const W=id=>pool.find(v=>v.id===id)||{};
  return `<p class="muted small">Tap a word, then its meaning. ${best?`Best time: <b>${best}s</b>`:''}</p>
  <div class="match"><div class="stack">${m.left.map(id=>`<button data-a="m-left" data-v="${esc(id)}" class="${m.ok.includes(id)?'ok':''} ${m.sel===id?'sel':''}" ${m.ok.includes(id)?'disabled':''}>${esc(W(id).word)}</button>`).join('')}</div>
  <div class="stack">${m.right.map(id=>`<button data-a="m-right" data-v="${esc(id)}" class="${m.ok.includes(id)?'ok':''} ${m.bad===id?'no':''}" ${m.ok.includes(id)?'disabled':''}>${esc(W(id).meaning)}</button>`).join('')}</div></div>`;
}
const hasGap = v => v.example && new RegExp(escRe(v.word),'i').test(v.example);
function buildQuiz(pool, all, kind){
  const src = kind==='gap' ? pool.filter(hasGap) : pool;
  const ids = shuffle(src.map(v=>v.id)).slice(0,10);
  return {kind, i:0, score:0, ans:null, wrong:[], qs:ids.map(id=>{
    const others = shuffle(all.filter(v=>v.id!==id).map(v=>v.id)).slice(0,3);
    return {id, dir: kind==='gap' ? 'gap' : (Math.random()<.5?'w2m':'m2w'), opts: shuffle([id,...others])};
  })};
}
function quizView(pool, all, kind){
  if(all.length<4) return empty('Practice needs at least 4 words in this class.');
  if(kind==='gap' && !pool.some(hasGap)) return empty('None of these words has an example sentence to fill in yet.');
  let q=S.ui.quiz; if(!q || q.kind!==kind) q=S.ui.quiz=buildQuiz(pool,all,kind);
  const W=id=>all.find(v=>v.id===id)||{};
  if(q.i>=q.qs.length){
    const p=pct(q.score,q.qs.length);
    return `<div class="empty" style="font-style:normal"><span class="eyebrow">Result</span><span class="hello">${q.score} / ${q.qs.length}</span><span>${p>=90?'Excellent! You really know these words.':p>=70?'Good work. Review the words below once more.':'Keep going. Practise the missed words with flashcards, then try again.'}</span>
      ${q.wrong.length?`<div class="stack" style="text-align:left;width:100%;max-width:460px"><span class="eyebrow">Words to review · added to your error log</span>${q.wrong.map(id=>`<div class="quote"><b>${esc(W(id).word)}</b> · ${esc(W(id).meaning)}</div>`).join('')}</div>`:''}
      <button class="btn primary" data-a="quiz-new">Try another round</button></div>`;
  }
  const c=q.qs[q.i], v=W(c.id);
  const prompt = c.dir==='w2m' ? `<p class="small muted">What does this word mean?</p><p class="hello" style="font-size:clamp(28px,5vw,40px)">${esc(v.word)}</p>${posChip(v.pos)}`
    : c.dir==='m2w' ? `<p class="small muted">Which word means…</p><p style="font-size:21px;font-family:var(--display)">${esc(v.meaning)}</p>${posChip(v.pos)}`
    : `<p class="small muted">Choose the word that completes the sentence.</p><p style="font-size:21px;font-family:var(--display);font-style:italic">${esc(v.example.replace(new RegExp(escRe(v.word)+'\\w*','ig'),'________'))}</p>`;
  const label = id => c.dir==='w2m' ? W(id).meaning : W(id).word;
  return `<div class="cue stack" style="max-width:620px;margin:0 auto;width:100%">
    <div class="row between"><span class="eyebrow">Question ${q.i+1} of ${q.qs.length}</span><span class="chip lilac">Score ${q.score}</span></div>
    ${bar(pct(q.i,q.qs.length),'lilac')}${prompt}
    <div class="match" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${c.opts.map(id=>{
      let cls=''; if(q.ans){ if(id===c.id) cls='ok-show'; else if(id===q.ans) cls='no'; }
      return `<button data-a="quiz-ans" data-v="${esc(id)}" class="${cls}" ${q.ans?'disabled':''}>${esc(label(id))}</button>`;}).join('')}</div>
    ${q.ans?`<div class="notice" style="background:color-mix(in srgb,var(--${q.ans===c.id?'mint':'pink'}) 70%,var(--paper))">${q.ans===c.id?'Correct!':`The answer is <b>${esc(v.word)}</b>: ${esc(v.meaning)}.`}${v.example&&c.dir!=='gap'?`<br><i>${esc(v.example)}</i>`:''} <button class="btn sm" data-a="quiz-next">${q.i+1<q.qs.length?'Next question':'See result'}</button></div>`:''}</div>`;
}
function speedView(pool, all, sub){
  if(all.length<2) return empty('The speed round needs at least 2 words.');
  const sp=S.ui.speed||{state:'ready'}; const best=(sub.games||{}).speedBest;
  if(sp.state==='ready') return `<div class="empty" style="font-style:normal"><span class="eyebrow">60-second speed round</span><span>A word and a meaning appear. Decide quickly: do they match?</span>${best?`<span class="small">Your best: <b>${best}</b> correct</span>`:''}<button class="btn primary" data-a="speed-start">Start</button></div>`;
  if(sp.state==='done') return `<div class="empty" style="font-style:normal"><span class="eyebrow">Time’s up</span><span class="hello">${sp.score} correct</span><span>${sp.n} answered${best?` · best ${best}`:''}${sp.newBest?' · new personal best!':''}</span><button class="btn primary" data-a="speed-start">Play again</button></div>`;
  const W=id=>all.find(v=>v.id===id)||{};

  if(won){ gain = st.xp + B.bonus; }
  S.ui.battle={view:won?'win':'lose', mode:B.mode, foe:st.foe, stage:B.stage, gain, bonus:B.bonus, asked:B.asked, correct:B.correct, levelUp:false, why: won?'':(B.hp<=0?'hp':'time')};
  saveMySub(s=>{
    const qs=questOf(s);
    if(won){ qs.xp+=gain; qs.wins++;
      if(B.mode==='sounds'){ qs.sUnlocked=qs.sUnlocked||1; if(B.stage===qs.sUnlocked) qs.sUnlocked++; } else if(B.stage===qs.unlocked) qs.unlocked++;
      while(qs.xp>=xpNeed(qs.level)){ qs.xp-=xpNeed(qs.level); qs.level++; levelUp=true; } }
    s.games.quest=qs;
    missed.forEach(w=>s.errlog.push({id:rid(),type:'Vocabulary',wrong:'(missed in Knight’s Quest)',right:w.word,note:w.meaning,ts:new Date().toISOString()}));
    missedSounds.forEach(m=>s.errlog.push({id:rid(),type:'Pronunciation',wrong:m.wrong,right:m.right,note:m.note,ts:new Date().toISOString()}));
    s.errlog=s.errlog.slice(-300);
    S.ui.battle.levelUp=levelUp;
  });
  won ? (beep(660),setTimeout(()=>beep(990),180)) : beep(180);
}

/* ---------- vocabulary bank (teacher) ---------- */
function parseVocab(text){
  const lines = String(text||'').replace(/\r/g,'').split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return [];
  const sepOf = l => l.includes('\t') ? '\t' : l.includes('|') ? '|' : / [–—-] /.test(l) ? / [–—-] / : l.includes(';') ? ';' : (l.match(/,/g)||[]).length>=1 ? ',' : l.includes(':') ? ':' : null;
  const splitCsv = l => { const out=[]; let cur='', q=false; for(const ch of l){ if(ch==='"'){ q=!q; continue; } if(ch===','&&!q){ out.push(cur); cur=''; } else cur+=ch; } out.push(cur); return out; };
  const split = l => { const sp=sepOf(l); if(!sp) return [l]; if(sp===',') return splitCsv(l); return l.split(sp); };
  let cols = ['word','meaning','example','topic','pos'];
  const first = split(lines[0]).map(x=>x.trim().toLowerCase());
  const aliases = {word:['word','vocabulary','vocab','term','từ','từ vựng'],meaning:['meaning','definition','nghĩa','translation','dịch'],example:['example','sentence','ví dụ'],topic:['topic','chủ đề','category'],pos:['pos','part of speech','type','loại từ']};
  const header = first.some(h=>Object.values(aliases).flat().includes(h));
  if(header){ cols = first.map(h=>Object.keys(aliases).find(k=>aliases[k].includes(h))||''); lines.shift(); }
  return lines.map(l=>{ const parts=split(l).map(x=>x.trim()); const r={word:'',meaning:'',example:'',topic:'',pos:''};
    parts.forEach((v,i)=>{ const k=cols[i]; if(k && v) r[k]=v; });
    // "word (n)" → pos
    const m = r.word.match(/^(.+?)\s*\((n|v|adj|adv|noun|verb|adjective|adverb|phr|phrase)\.?\)$/i); if(m){ r.word=m[1]; r.pos ||= m[2]; }
    r.pos = ({n:'noun',v:'verb',adj:'adjective',adv:'adverb',phr:'phrase'})[String(r.pos).toLowerCase().replace(/\.$/,'')] || r.pos;
    return r; }).filter(r=>r.word && r.meaning);
}

    return `<label class="f ${fl.full?'full':''}" for="${id}">${fl.l}<input id="${id}" type="${fl.t}" value="${esc(v)}" ${fl.req?'required':''}></label>`; };
  if(m.coll==='homework' && !m.att) m.att = clone(cur.attachments||[]);
  const attEditor = m.coll!=='homework' ? '' : `<div class="full stack"><b class="small">Materials for students: Word, PDF, PowerPoint, Excel, images or audio (up to 20 MB each)</b>
    ${(m.att||[]).map((a,i)=>`<div class="att-edit"><span class="att-ic">${fileIcon(a.name,a.type)}</span><span class="att-name">${esc(a.name)}</span><span class="small muted">${fmtSize(a.size)}</span><button type="button" class="btn sm" data-a="att-del" data-v="${i}">Remove</button></div>`).join('')}
    ${(m.pending||[]).map((f,i)=>`<div class="att-edit" style="border-style:solid"><span class="att-ic">${fileIcon(f.name,f.type)}</span><span class="att-name">${esc(f.name)}</span><span class="chip warn">uploads on Save</span><button type="button" class="btn sm" data-a="att-pend-del" data-v="${i}">Remove</button></div>`).join('')}
    <label class="btn" for="m-files" style="align-self:flex-start;cursor:pointer">📎 Attach files<input id="m-files" type="file" multiple accept=".doc,.docx,.pdf,.ppt,.pptx,.xls,.xlsx,.txt,image/*,audio/*" style="position:absolute;width:1px;height:1px;opacity:0"></label>
    ${S.assets?'':'<p class="small muted">File upload isn’t available in this view.</p>'}</div>`;
  return `<div class="overlay" data-a="close-modal-bg">${win(`${m.id?'Edit':'New'} ${sc.label}`, `<form data-f="edit" class="form-grid">${sc.fields.map(f).join('')}${attEditor}<div class="row full"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" data-a="close-modal">Cancel</button></div></form>`,'butter')}</div>`;
}

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const pick = a => a[Math.floor(Math.random()*a.length)];
const escRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
let tInt=null, audioCtx=null; const openD=new Set();
document.addEventListener('toggle', e=>{ const d=e.target; if(d.tagName==='DETAILS' && d.dataset.key){ d.open?openD.add(d.dataset.key):openD.delete(d.dataset.key); } }, true);
function beep(f=880){ try{ audioCtx ||= new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=f; o.type='square'; g.gain.value=.06; o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.25);}catch{} }
function startTimer(v){
  clearInterval(tInt); beep(660);
  const t=S.ui.timer;
  if(v==='p2'){ Object.assign(t,{phase:'prep',left:60,total:60,next:120}); }
  else Object.assign(t,{phase:'speak',left:+v,total:+v,next:null});
  tInt=setInterval(()=>{ t.left--; if(t.left<=0){ if(t.phase==='prep'&&t.next){ beep(990); Object.assign(t,{phase:'speak',left:t.next,total:t.next,next:null}); } else { beep(440); t.phase='done'; t.left=0; clearInterval(tInt);} } updateTimer(); },1000);
  updateTimer();
}
function updateTimer(){
  const d=$('#t-digits'); if(!d) return; const t=S.ui.timer;
  d.textContent=`${Math.floor(t.left/60)}:${String(t.left%60).padStart(2,'0')}`;
  $('#t-phase').textContent = {idle:'Ready',prep:'Prepare · make notes',speak:'Speak now',done:'Time’s up'}[t.phase];
  const p = t.total ? Math.round((1-t.left/t.total)*100) : 0; const i=$('#t-bar i'); if(i) i.style.width=p+'%';
}

  if(kind==='post'){
    const text=val('hub-text'); if(!text) return;
    if(S.ui.gate==='preview'){ toast('Preview mode: nothing is saved.'); return; }
    const doc=clone(S.d.chat[S.uid]||{posts:[]}); delete doc.id;
    doc.teacher=S.isOwner; doc.posts=[...(doc.posts||[]),{id:rid(),classId:(S.d.lessons.find(l=>l.id===S.ui.hubLesson)||{}).classId||'',lessonId:S.ui.hubLesson,text,ts:new Date().toISOString()}].slice(-200);
    f.reset(); S.d.chat[S.uid]=doc; render();
    await writeDoc(`chat/${S.uid}`,doc).catch(()=>{});
  }
  if(kind==='err'){
    const e={id:rid(),type:val('e-type'),wrong:val('e-wrong'),right:val('e-right'),note:val('e-note'),ts:new Date().toISOString()};
    f.reset(); await saveMySub(s=>{ s.errlog.push(e); s.errlog=s.errlog.slice(-300); }); toast('Added to your error log.');
  }
  // teacher
  if(kind==='edit'){
    const m=S.ui.modal, sc=SCHEMAS[m.coll], body={};
    sc.fields.forEach(fl=>{ let x=val('m-'+fl.k); if(fl.t==='number') x=Number(x)||0; body[fl.k]=x; });
    if(m.coll==='classes'){ body.code=String(body.code).toUpperCase().replace(/[^A-Z0-9-]/g,''); if(S.d.classes.some(c=>c.code===body.code && c.id!==m.id)){ toast('Another class already uses that join code.'); return; } }
    const id=m.id||rid(); const prev=m.id?(m.coll==='classes'?classById(id):S.d[m.coll].find(x=>x.id===id))||{}:{};
    const {id:_drop,...prevRest}=prev;
    if(m.coll==='homework'){
      const atts=[...(m.att||[])], pend=m.pending||[];
      if(pend.length && !S.assets){ toast('File upload isn’t available here. Remove the files or try again later.'); return; }
      const btn=f.querySelector('button[type=submit]');
      for(let i=0;i<pend.length;i++){ const file=pend[i];
        if(btn){ btn.disabled=true; btn.textContent=`Uploading ${i+1}/${pend.length}…`; }
        try{ const r=await S.assets.upload(file, file.type?{type:file.type}:undefined); atts.push({name:file.name, ref:r.id, type:r.contentType||file.type||'', size:r.sizeBytes||file.size}); }
        catch(e){ if(btn){ btn.disabled=false; btn.textContent='Save'; }
          const c=e&&e.code;
          toast(c==='unsupported_type'?`“${file.name}” can’t be stored on this version of the site. Save it as PDF and attach that instead.`:c==='too_large'?`“${file.name}” is over 20 MB.`:`“${file.name}” didn’t upload. Try again.`);
          m.att=atts; m.pending=pend.slice(i); render(); return; } }
      body.attachments=atts;
    }
    const doc={...prevRest,...body,updatedAt:new Date().toISOString(),createdAt:prev.createdAt||new Date().toISOString()};
    S.ui.modal=null; render();
    await writeDoc(`${m.coll}/${id}`, doc).then(()=>toast('Saved.')).catch(()=>{});
  }
  if(kind==='bulk'){
    const cid=val('bk-class'), lines=val('bk-text').split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(p=>p[0]&&p[1]);
    if(!lines.length){ toast('Use one line per word: word | meaning'); return; }
    S.ui.modal=null; render();
    for(const p of lines){ await writeDoc(`vocab/${rid()}`,{classId:cid,word:p[0],meaning:p[1],example:p[2]||'',topic:p[3]||'',pos:'',createdAt:new Date().toISOString()}).catch(()=>{}); }
    toast(`Added ${lines.length} word${lines.length===1?'':'s'}.`);
  }
  if(kind==='grade'){
    const uid=f.dataset.uid, hw=f.dataset.hw, g=clone(gradeOf(uid)); delete g.id;
    g.items ||= {}; g.items[hw]={score:val(`g-s-${uid}-${hw}`),feedback:val(`g-f-${uid}-${hw}`),ts:new Date().toISOString()};
    S.ui.studentSel=uid; await writeDoc(`grades/${uid}`,g).then(()=>toast('Grade saved.')).catch(()=>{});
  }
  if(kind==='bonus'){
    const uid=f.dataset.uid, g=clone(gradeOf(uid)); delete g.id;
    const pts=Number(val('b-pts'))||0; if(!pts){ toast('Enter a number of points.'); return; }
    g.bonus=[...(g.bonus||[]),{pts,reason:val('b-why'),ts:new Date().toISOString()}];
    f.reset(); await writeDoc(`grades/${uid}`,g).then(()=>toast(`Gave ${pts} bonus point${pts===1?'':'s'}.`)).catch(()=>{});
  }
  if(kind==='t-err'){
    const uid=f.dataset.uid, sub=clone(S.d.subs[uid]||{items:{},mastered:[],errlog:[],games:{}}); delete sub.id;
    sub.errlog=[...(sub.errlog||[]),{id:rid(),type:val('te-type'),wrong:val('te-wrong'),right:val('te-right'),note:'Added by teacher',ts:new Date().toISOString()}];
    f.reset(); await writeDoc(`subs/${uid}`,sub).then(()=>toast('Added to their error log.')).catch(()=>{});
  }
  if(kind==='look') await saveSettings({title:val('lk-title')||DEFAULTS.title,welcome:val('lk-welcome'),nav:val('lk-nav'),corners:val('lk-corners')});
  if(kind==='rules') await saveSettings({points:{latePct:Number(val('pr-late'))||0,vocabPer:Math.max(1,Number(val('pr-vper'))||10),vocabPts:Number(val('pr-vpts'))||0,commentPts:Number(val('pr-cpts'))||0,commentCap:Number(val('pr-ccap'))||0,questPts:Number(val('pr-qpts'))||0}});
});

/* ambient gold dust and petals behind the whole page */
(function pageFx(){
  if(reduceMotion()) return;
  const cv=document.getElementById('page-fx'); if(!cv) return; const ctx=cv.getContext('2d'); let parts=[];
  function size(){ const d=Math.min(2,window.devicePixelRatio||1); cv.width=innerWidth*d; cv.height=innerHeight*d; ctx.setTransform(d,0,0,d,0,0); }
  size(); addEventListener('resize',size);
  for(let i=0;i<26;i++) parts.push(mk(true));
  function mk(init){ const petal=Math.random()<.18; return {petal,x:Math.random()*innerWidth,y:init?Math.random()*innerHeight:(petal?-10:innerHeight+10),r:petal?3+Math.random()*2.5:1+Math.random()*1.6,vx:(Math.random()-.5)*.25,vy:petal?.25+Math.random()*.3:-(.12+Math.random()*.3),rot:Math.random()*6,vr:(Math.random()-.5)*.02,f:Math.random()*6,t:0}; }
  function tick(){
    if(document.hidden){ requestAnimationFrame(tick); return; }
    ctx.clearRect(0,0,innerWidth,innerHeight);
    const dark = matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme!=='light' || document.documentElement.dataset.theme==='dark';
    parts.forEach((p,i)=>{ p.t++; p.x+=p.vx+Math.sin((p.t+p.f*40)/90)*.15; p.y+=p.vy; p.rot+=p.vr;
      if(p.petal){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=dark?'rgba(214,150,170,.45)':'rgba(232,160,178,.55)'; ctx.beginPath(); ctx.ellipse(0,0,p.r,p.r*.55,0,0,Math.PI*2); ctx.fill(); ctx.restore(); }
      else { const tw=.55+.45*Math.sin(p.t/25+p.f), R=p.r*(1+tw*.6); ctx.fillStyle=dark?`rgba(230,200,130,${.55*tw})`:`rgba(196,154,72,${.55*tw})`;
        ctx.beginPath(); ctx.moveTo(p.x,p.y-R*1.8); ctx.quadraticCurveTo(p.x,p.y,p.x+R*1.8,p.y); ctx.quadraticCurveTo(p.x,p.y,p.x,p.y+R*1.8); ctx.quadraticCurveTo(p.x,p.y,p.x-R*1.8,p.y); ctx.quadraticCurveTo(p.x,p.y,p.x,p.y-R*1.8); ctx.fill(); }
      if(p.y<-20||p.y>innerHeight+20||p.x<-20||p.x>innerWidth+20) parts[i]=mk(false);
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
boot();
</script>
