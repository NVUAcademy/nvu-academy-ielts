<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Reading · NVU Academy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { margin:0; font-family:Arial,"Helvetica Neue",sans-serif; color:#1b1b1b; background:#fff; font-size:15px; line-height:1.55; }
  .hdr { display:flex; align-items:center; gap:18px; padding:12px 18px; border-bottom:1px solid #d6d6d6; }
  .hdr .brand { font-weight:700; color:#e0662d; }
  .hdr .title { font-weight:700; font-size:16px; }
  .timer { margin-left:auto; font-weight:700; font-size:15px; color:#1b1b1b; background:#f2f2f2; padding:6px 12px; border-radius:6px; }
  .part-bar { background:#eef5ee; padding:12px 18px; border-bottom:1px solid #d6d6d6; }
  .part-bar b { font-size:17px; } .part-bar div { color:#555; font-size:14px; }
  .panes { display:grid; grid-template-columns: 1fr 1fr; height:calc(100vh - 210px); min-height:420px; }
  .pane { overflow-y:auto; padding:18px 22px; }
  .pane.left { border-right:1px solid #d6d6d6; }
  .passage p { margin:0 0 14px; }
  .q-title { font-weight:700; margin:4px 0 8px; }
  .q-instr { color:#333; margin-bottom:12px; }
  .q { margin:0 0 16px; }
  .q .qn { display:inline-block; min-width:26px; height:24px; line-height:24px; text-align:center; border:1px solid #1b1b1b; border-radius:3px; font-weight:700; margin-right:8px; }
  .opts label { display:block; padding:4px 0; cursor:pointer; }
  .opts input { margin-right:8px; }
  input[type=text] { border:1px solid #999; border-radius:3px; padding:5px 8px; font-size:15px; width:220px; }
  .nav { position:fixed; left:0; right:0; bottom:0; background:#f4f4f4; border-top:1px solid #d6d6d6; display:flex; align-items:center; gap:14px; padding:8px 18px; }
  .nav .nums { display:flex; gap:6px; flex-wrap:wrap; }
  .nav .num { min-width:26px; height:26px; line-height:26px; text-align:center; border:1px solid #888; border-radius:3px; cursor:pointer; background:#fff; font-size:13px; }
  .nav .num.cur { border:2px solid #1b1b1b; font-weight:700; }
  .nav .num.done { background:#d9ead3; }
  .btn { background:#e0662d; color:#fff; border:none; border-radius:4px; padding:9px 18px; font-weight:700; cursor:pointer; }
  .btn.ghost { background:#fff; color:#e0662d; border:1px solid #e0662d; }
  .result { padding:18px 22px; max-width:760px; margin:0 auto; }
  .big { font-size:36px; font-weight:700; color:#e0662d; }
  .wrap-bottom { height:80px; }
  .note { color:#666; font-size:13px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="wrap-bottom"></div>
<div class="nav" id="nav" style="display:none">
  <button class="btn ghost" onclick="prevQ()">‹</button>
  <div class="nums" id="nums"></div>
  <button class="btn ghost" onclick="nextQ()">›</button>
  <button class="btn" onclick="submitTest()">Nộp bài</button>
</div>

<script>
const SUPABASE_URL = 'https://sxnxbbosfyapmmkrhcdj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_OMyiSjOVcKOfRdZO9JwSZg_8XogOYkZ';
let student = null;
try { student = JSON.parse(localStorage.getItem('nvu_student') || 'null'); } catch (e) {}
if (!student) location.replace('login.html');

/* Đề thử: đoạn văn tự soạn, dạng câu hỏi như Reading IELTS (True/False/Not Given, chọn đáp án, điền chỗ trống) */
const TEST = {
  id: 'reading-demo-1', title: 'Reading Practice Test 1', minutes: 60,
  passages: [{
    title: 'The Night Market',
    text: [
      'Every Friday evening, the narrow streets of an old district in Hanoi are transformed. Food stalls appear one after another, and the smell of grilled meat and fresh herbs drifts across the square. Local families arrive early, and tourists soon follow.',
      'The market began in the 1990s, when a few families sold noodles from carts to office workers on their way home. Over time the stalls multiplied, and the night market became a place where people meet friends rather than simply buy dinner. Many vendors still use recipes that have been passed down for three generations.',
      'Not everyone welcomes the crowds. Some residents complain about noise after midnight and about rubbish left on the pavements. In response, the local council introduced a rule in 2019 requiring vendors to clear their area by eleven o’clock and to use reusable plates. Compliance has been uneven, but most stallholders now sort their waste into separate bins.',
      'Economists who have studied the market estimate that it supports around two hundred small businesses. Many of these are run by women, who use their earnings to pay for their children’s schooling. Some researchers argue that the market’s greatest value lies not in its income but in the social networks it creates among neighbours who would otherwise rarely speak to one another.'
    ]
  }],
  groups: [
    { part: 1, instr: 'Do the following statements agree with the information given in the reading passage? Write TRUE if the statement agrees with the information, FALSE if the statement contradicts the information, NOT GIVEN if there is no information on this.', type: 'tfng', qs: [
      { n: 1, text: 'The night market has existed since the 1990s.', answer: 'TRUE' },
      { n: 2, text: 'All vendors at the market sell only noodles.', answer: 'FALSE' },
      { n: 3, text: 'The market is open every day of the week.', answer: 'NOT GIVEN' },
      { n: 4, text: 'The council made a rule about rubbish in 2019.', answer: 'TRUE' }
    ] },
    { part: 2, instr: 'Choose the correct letter, A, B, C or D.', type: 'mcq', qs: [
      { n: 5, text: 'What did some residents complain about?', opts: ['the price of food', 'noise and rubbish', 'the distance to the market', 'the lack of tourists'], answer: 1 },
      { n: 6, text: 'Why do some researchers think the market is valuable?', opts: ['it earns a lot of money', 'it creates social networks', 'it is the oldest market in Hanoi', 'it attracts foreign investors'], answer: 1 }
    ] },
    { part: 3, instr: 'Complete the sentences. Write NO MORE THAN THREE WORDS from the passage for each answer.', type: 'gap', qs: [
      { n: 7, text: 'Vendors must finish clearing their area by ____.', answer: ['eleven o’clock', 'eleven o clock', '11 o’clock', '11 o clock', '11pm', '11 pm'] },
      { n: 8, text: 'Around two hundred businesses are supported by the ____.', answer: ['market'] }
    ] }
  ]
};

const flat = TEST.groups.flatMap(g => g.qs.map(q => ({ ...q, group: g })));
let cur = 0, answers = {}, startTime = Date.now(), finished = false, tick = null;

function norm(s) { return String(s || '').toLowerCase().replace(/[’']/g, '').replace(/\s+/g, ' ').trim(); }
function gapOk(q, v) { return (Array.isArray(q.answer) ? q.answer : [q.answer]).map(norm).includes(norm(v)); }

function render() {
  if (finished) return renderResult();
  const q = flat[cur], g = q.group;
  const p = TEST.passages[0];
  const passage = '<div class="pane left passage"><h2 style="font-size:18px;margin-top:0">' + p.title + '</h2>' + p.text.map(t => '<p>' + t + '</p>').join('') + '</div>';
  const groupQs = g.qs.map(x => {
    const v = answers[x.n] || '';
    let input = '';
    if (g.type === 'tfng') input = ['TRUE', 'FALSE', 'NOT GIVEN'].map(o => '<label><input type="radio" name="q' + x.n + '" value="' + o + '" ' + (v === o ? 'checked' : '') + ' onchange="setAns(' + x.n + ',this.value)">' + o + '</label>').join('');
    if (g.type === 'mcq') input = x.opts.map((o, i) => '<label><input type="radio" name="q' + x.n + '" value="' + i + '" ' + (String(v) === String(i) ? 'checked' : '') + ' onchange="setAns(' + x.n + ',this.value)">' + String.fromCharCode(65 + i) + '. ' + o + '</label>').join('');
    if (g.type === 'gap') input = '<input type="text" value="' + String(v).replace(/"/g, '&quot;') + '" oninput="setAns(' + x.n + ',this.value)">';
    return '<div class="q"><span class="qn">' + x.n + '</span>' + x.text + '<div class="opts" style="margin-top:6px">' + input + '</div></div>';
  }).join('');
  const questions = '<div class="pane"><div class="q-title">Part ' + g.part + '</div><div class="q-instr">' + g.instr + '</div>' + groupQs + '</div>';
  document.getElementById('app').innerHTML =
    '<div class="hdr"><span class="brand">IELTS</span><span class="title">' + TEST.title + '</span><span class="timer" id="timer">60:00</span></div>' +
    '<div class="part-bar"><b>Part ' + g.part + '</b><div>Read the text and answer questions ' + g.qs[0].n + '–' + g.qs[g.qs.length - 1].n + '</div></div>' +
    '<div class="panes">' + passage + questions + '</div>';
  renderNav();
}
function renderNav() {
  const nav = document.getElementById('nav'); nav.style.display = 'flex';
  document.getElementById('nums').innerHTML = flat.map((q, i) => '<span class="num ' + (i === cur ? 'cur' : '') + ' ' + (answers[q.n] !== undefined && answers[q.n] !== '' ? 'done' : '') + '" onclick="goto(' + i + ')">' + q.n + '</span>').join('');
}
function setAns(n, v) { answers[n] = v; renderNav(); }
function goto(i) { cur = i; render(); }
function prevQ() { if (cur > 0) { cur--; render(); } }
function nextQ() { if (cur < flat.length - 1) { cur++; render(); } }

function score() {
  let raw = 0;
  flat.forEach(q => {
    const v = answers[q.n];
    if (q.group.type === 'mcq') { if (String(v) === String(q.answer)) raw++; }
    else if (q.group.type === 'tfng') { if (String(v).toUpperCase() === q.answer) raw++; }
    else if (q.group.type === 'gap') { if (gapOk(q, v)) raw++; }
  });
  return raw;
}
function bandOf(raw, total) {
  const pct = raw / total;
  return pct >= 0.9 ? 8 : pct >= 0.8 ? 7 : pct >= 0.65 ? 6 : pct >= 0.5 ? 5 : pct >= 0.35 ? 4 : 3;
}
function submitTest() {
  if (!confirm('Nộp bài bây giờ?')) return;
  finished = true; clearInterval(tick); render();
}
function renderResult() {
  const raw = score(), total = flat.length, band = bandOf(raw, total);
  const rows = flat.map(q => {
    const v = answers[q.n] === undefined ? '' : answers[q.n];
    let ok = false, shown = v, right = q.answer;
    if (q.group.type === 'mcq') { ok = String(v) === String(q.answer); shown = v === '' ? '' : String.fromCharCode(65 + Number(v)); right = String.fromCharCode(65 + q.answer); }
    else if (q.group.type === 'tfng') ok = String(v).toUpperCase() === q.answer;
    else if (q.group.type === 'gap') { ok = gapOk(q, v); right = Array.isArray(q.answer) ? q.answer[0] : q.answer; }
    return '<tr><td>' + q.n + '</td><td>' + (shown || '—') + '</td><td>' + right + '</td><td>' + (ok ? '✓' : '✗') + '</td></tr>';
  }).join('');
  document.getElementById('app').innerHTML = '<div class="result"><h2>Kết quả</h2><div class="big">' + raw + ' / ' + total + '</div><p>Band ước lượng: <b>' + band + '.0</b> (chỉ để tham khảo)</p>' +
    '<table border="1" cellpadding="6" style="border-collapse:collapse;width:100%"><tr><th>Câu</th><th>Em trả lời</th><th>Đáp án</th><th></th></tr>' + rows + '</table>' +
    '<p style="margin-top:16px"><a href="luyen-de.html" class="btn ghost" style="text-decoration:none">← Về Luyện đề</a></p></div>';
  document.getElementById('nav').style.display = 'none';
  saveReading(raw, total, band);
}
/* Lưu kết quả một lần khi nộp, rồi hiện lịch sử đọc của học sinh */
let readingSaved = false;
async function saveReading(raw, total, band) {
  if (readingSaved) return;
  readingSaved = true;
  const box = document.querySelector('.result');
  try {
    await fetch('/api/skill-history', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({
      student_id: student.id, skill: 'reading', test_id: TEST.id, test_title: TEST.title, score: raw, max_score: total, band, detail: { answers } }) });
  } catch (e) {}
  if (!box) return;
  box.insertAdjacentHTML('beforeend', '<h3 style="margin-top:24px">Lịch sử làm bài đọc</h3><div id="rhist">Đang tải…</div>');
  try {
    const j = await (await fetch('/api/student-data?res=skill-history&student_id=' + encodeURIComponent(student.id) + '&skill=reading')).json();
    const rows = (j && j.data) || [];
    document.getElementById('rhist').innerHTML = rows.length ? rows.map(r => '<div style="padding:6px 0;border-top:1px solid #ddd">' +
      new Date(r.created_at).toLocaleString('vi-VN') + ' · ' + r.score + ' / ' + r.max_score + ' · band ' + r.band + '</div>').join('') : 'Chưa có bài nào.';
  } catch (e) { document.getElementById('rhist').textContent = 'Chưa tải được lịch sử.'; }
}
function startTimer() {
  tick = setInterval(() => {
    const left = Math.max(0, TEST.minutes * 60 - Math.floor((Date.now() - startTime) / 1000));
    const el = document.getElementById('timer'); if (el) el.textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
    if (left === 0) { finished = true; clearInterval(tick); render(); }
  }, 1000);
}
if (student) { render(); startTimer(); }
</script>
</body>
</html>
