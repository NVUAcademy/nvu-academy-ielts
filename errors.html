<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhật ký lỗi — NVU Academy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Jost:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<style>
:root { --bg:#F8F2E9; --paper:#FFFCF6; --ink:#2F2638; --muted:#7D7183; --gold:#B08D57; --line:rgba(176,141,87,.45); --soft:#F2E9DC; --shadow:0 18px 40px -22px rgba(64,40,52,.35), 0 2px 6px -3px rgba(64,40,52,.18); --good:#5E8B6E; --bad:#B05468; --pink:#EBC7C9; --mint:#CBDCCB; --butter:#F0DFB6; --lilac:#D9CFE7; --display:"Bodoni Moda","Playfair Display","Didot",Georgia,serif; --body:"Jost","Futura",system-ui,sans-serif; }
@media (prefers-color-scheme: dark) { :root { --bg:#1D1723; --paper:#271F2E; --ink:#F3EADF; --muted:#B5A8B4; --gold:#D3B47A; --line:rgba(211,180,122,.4); --soft:#30273A; --good:#9CCBA9; --bad:#E08C9E; --pink:#C99AA0; --mint:#A3BEA6; --butter:#D8C08A; --lilac:#B5A7CC; } }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--body); background:var(--bg); color:var(--ink); min-height:100vh; font-size:17px; padding:0 18px 60px; }
.wrap { max-width:820px; margin:0 auto; }
.top { display:flex; justify-content:space-between; padding:20px 0; font-size:15px; color:var(--muted); }
.top a { color:var(--gold); text-decoration:none; font-weight:500; }
h1 { font-family:var(--display); font-weight:500; font-size:34px; text-align:center; margin:10px 0 4px; } h1 em { color:var(--gold); font-weight:400; }
.sub { text-align:center; color:var(--muted); margin-bottom:20px; }
.tabs { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:18px; }
.tab { border:1px solid var(--line); background:var(--paper); color:var(--muted); border-radius:30px; padding:9px 20px; font:inherit; font-size:15px; cursor:pointer; }
.tab.on { background:var(--gold); color:#fff; border-color:var(--gold); }
.card { background:var(--paper); border:1px solid var(--line); border-radius:22px; padding:22px 24px; box-shadow:var(--shadow); margin-bottom:16px; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:16px; }
.stat { background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:14px; text-align:center; } .stat b { display:block; font-family:var(--display); font-size:30px; } .stat span { font-size:13px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; }
.filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.chip { border:1px solid var(--line); background:var(--soft); color:var(--ink); border-radius:20px; padding:6px 14px; font:inherit; font-size:14px; cursor:pointer; } .chip.on { background:var(--gold); color:#fff; border-color:var(--gold); }
.err { border-top:1px solid var(--line); padding:14px 0; } .err:first-child { border-top:none; }
.err .q { font-size:15px; color:var(--muted); margin-bottom:4px; }
.err .row { display:flex; gap:18px; flex-wrap:wrap; font-size:16px; } .bad { color:var(--bad); font-weight:600; } .good { color:var(--good); font-weight:600; }
.meta { font-size:13px; color:var(--muted); margin-top:4px; }
.badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:600; background:rgba(176,141,87,.18); color:var(--gold); margin-right:6px; } .badge.ok { background:rgba(94,139,110,.2); color:var(--good); }
.btn { border:none; background:var(--gold); color:#fff; border-radius:30px; padding:11px 26px; font:inherit; font-size:15px; font-weight:600; cursor:pointer; }
.btn.ghost { background:none; border:1px solid var(--gold); color:var(--gold); } .btn:disabled { opacity:.5; }
.empty { text-align:center; color:var(--muted); padding:28px; }
.rv-q { font-size:20px; line-height:1.55; margin:10px 0 16px; } .rv-tag { font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:600; }
input[type=text] { width:100%; background:var(--soft); border:1px solid var(--line); border-radius:14px; padding:14px 16px; font:inherit; font-size:18px; color:var(--ink); outline:none; }
.opt { display:block; width:100%; text-align:left; padding:13px 16px; margin-bottom:10px; border-radius:14px; border:1px solid var(--line); background:var(--soft); color:var(--ink); font:inherit; font-size:17px; cursor:pointer; } .opt:hover { border-color:var(--gold); }
.prog { height:8px; background:var(--soft); border-radius:6px; overflow:hidden; margin-bottom:16px; } .prog i { display:block; height:100%; background:var(--gold); transition:width .3s; }
.fb { margin-top:14px; padding:12px 16px; border-radius:14px; font-size:16px; } .fb.ok { background:rgba(94,139,110,.18); color:var(--good); } .fb.no { background:rgba(176,84,104,.14); color:var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html">← Trang chủ</a><span id="who"></span></div>
  <h1>Nhật ký <em>lỗi</em></h1>
  <div class="sub">Mọi câu sai của em, tự động gom lại. Ôn đúng 2 lần liên tiếp là "đã nắm".</div>
  <div class="tabs"><button class="tab on" id="t-review" onclick="show('review')">Ôn lỗi</button><button class="tab" id="t-log" onclick="show('log')">Nhật ký</button><button class="tab" id="t-week" onclick="show('week')">Tổng hợp tuần</button></div>
  <div id="stats" class="stats"></div>
  <div id="view"></div>
</div>

<script>
const db = supabase.createClient('https://sxnxbbosfyapmmkrhcdj.supabase.co', 'sb_publishable_OMyiSjOVcKOfRdZO9JwSZg_8XogOYkZ');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYPE = { vocabulary: 'Từ vựng', grammar: 'Ngữ pháp', listening: 'Listening', pronunciation: 'Phát âm' };
const MASTER_AT = 2, SESSION_N = 12;
let student = null, errs = [], tab = 'review', typeF = '', rv = null;
try { student = JSON.parse(localStorage.getItem('nvu_student') || 'null'); } catch (e) {}
if (!student) location.href = 'login.html';
else { document.getElementById('who').textContent = `${student.avatar || '🎓'} ${student.name} · ${student.classCode}`; load(); }

const errDate = e => String(e.practice_date || e.created_at || '').slice(0, 10);
function isoToday() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function mondayOf(s) { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
const shortD = s => s.slice(8, 10) + '/' + s.slice(5, 7);

async function load() {
  const { data, error } = await db.from('error_logs').select('*').eq('student_id', student.id).order('created_at', { ascending: false }).limit(2000);
  if (error) { document.getElementById('view').innerHTML = `<div class="card empty">Không tải được: ${esc(error.message)}</div>`; return; }
  errs = data || [];
  stats(); show(tab);
}
function stats() {
  const open = errs.filter(e => !e.is_resolved).length, done = errs.length - open;
  const week = errs.filter(e => errDate(e) >= mondayOf(isoToday())).length;
  document.getElementById('stats').innerHTML =
    `<div class="stat"><b>${errs.length}</b><span>Tổng lỗi</span></div><div class="stat"><b>${open}</b><span>Cần ôn</span></div><div class="stat"><b>${done}</b><span>Đã nắm</span></div><div class="stat"><b>${week}</b><span>Lỗi tuần này</span></div>`;
}
function show(t) {
  tab = t; ['review', 'log', 'week'].forEach(k => document.getElementById('t-' + k).classList.toggle('on', k === t));
  if (t === 'review') renderReviewHome(); else if (t === 'log') renderLog(); else renderWeek();
}

/* ---------- Nhật ký ---------- */
function renderLog() {
  const list = errs.filter(e => !typeF || e.error_type === typeF);
  const types = [...new Set(errs.map(e => e.error_type))];
  document.getElementById('view').innerHTML = `<div class="card"><div class="filters"><button class="chip ${!typeF ? 'on' : ''}" onclick="setType('')">Tất cả</button>${types.map(t => `<button class="chip ${typeF === t ? 'on' : ''}" onclick="setType('${esc(t)}')">${esc(TYPE[t] || t)}</button>`).join('')}</div>` +
    (list.length ? list.map(e => `<div class="err"><div class="q">${esc(e.context || '')}</div>
      <div class="row"><span>Em trả lời: <span class="bad">${esc(e.error_content)}</span></span><span>Đáp án: <span class="good">${esc(e.correct_answer || '—')}</span></span></div>
      <div class="meta"><span class="badge">${esc(TYPE[e.error_type] || e.error_type)}</span>${e.is_resolved ? '<span class="badge ok">Đã nắm</span>' : `<span class="badge">Chuỗi ôn ${e.review_streak || 0}/${MASTER_AT}</span>`}${esc(e.source || '')} · ${esc(shortD(errDate(e)))}</div></div>`).join('') : '<div class="empty">Chưa có lỗi nào. Tuyệt vời!</div>') + '</div>';
}
function setType(t) { typeF = t; renderLog(); }

/* ---------- Tổng hợp tuần ---------- */
function renderWeek() {
  const weeks = {}; errs.forEach(e => { const w = mondayOf(errDate(e)); (weeks[w] = weeks[w] || []).push(e); });
  const keys = Object.keys(weeks).sort().reverse().slice(0, 6);
  document.getElementById('view').innerHTML = keys.length ? keys.map(w => {
    const L = weeks[w], byType = {}; L.forEach(e => byType[e.error_type] = (byType[e.error_type] || 0) + 1);
    const rep = {}; L.forEach(e => { const k = (e.correct_answer || e.error_content || '').toLowerCase().trim(); rep[k] = (rep[k] || 0) + 1; });
    const repeats = Object.entries(rep).filter(([, n]) => n > 1);
    const open = L.filter(e => !e.is_resolved).length;
    return `<div class="card"><div class="rv-tag">Tuần ${shortD(w)} – ${shortD((() => { const d = new Date(w + 'T00:00:00'); d.setDate(d.getDate() + 6); return d.toISOString().slice(0, 10); })())}</div>
      <div style="margin:8px 0;font-size:17px">${L.length} lỗi · <b class="good">${L.length - open} đã nắm</b> · <b class="bad">${open} cần ôn</b></div>
      <div>${Object.entries(byType).map(([t, n]) => `<span class="badge">${esc(TYPE[t] || t)}: ${n}</span>`).join('')}</div>
      ${repeats.length ? `<div class="meta" style="margin-top:10px">Lỗi lặp lại: ${repeats.map(([k, n]) => esc(k) + ' (×' + n + ')').join('; ')}</div>` : ''}</div>`;
  }).join('') : '<div class="card empty">Chưa có dữ liệu tuần nào.</div>';
}

/* ---------- Ôn lỗi ---------- */
function renderReviewHome() {
  const open = errs.filter(e => !e.is_resolved);
  document.getElementById('view').innerHTML = open.length
    ? `<div class="card" style="text-align:center"><div class="rv-tag">Bộ bài ôn lỗi</div><div style="font-size:19px;margin:10px 0 16px">Em còn <b>${open.length}</b> lỗi cần ôn. Mỗi lượt ôn gồm tối đa ${SESSION_N} câu, ưu tiên các lỗi mới và lỗi chưa ôn đủ.</div><button class="btn" onclick="startReview()">Bắt đầu ôn</button></div>`
    : '<div class="card empty">Em chưa có lỗi nào cần ôn. Cứ giữ phong độ nhé!</div>';
}
function normA(s) { return String(s ?? '').toLowerCase().replace(/[×]/g, 'x').replace(/\b(km|m)\b/g, '').replace(/^[a-d]\.\s*/i, '').replace(/[£$,]/g, '').replace(/[‘’'`]/g, '').replace(/[-‐-―]/g, ' ').replace(/[^\p{L}\p{N}\s.x]/gu, '').replace(/\s+/g, ' ').trim(); }
function sameA(a, b) { const x = normA(a), y = normA(b); if (!x || !y) return false; if (x === y) return true; const xs = x.replace(/\s/g, ''), ys = y.replace(/\s/g, ''); return xs === ys; }
const isMcq = e => /^[A-D]\.\s/.test(String(e.correct_answer || ''));

function startReview() {
  const open = errs.filter(e => !e.is_resolved).sort((a, b) => (a.review_streak || 0) - (b.review_streak || 0) || (errDate(a) < errDate(b) ? 1 : -1)).slice(0, SESSION_N);
  rv = { items: open, i: 0, right: 0, answered: false };
  renderCard();
}
function renderCard() {
  const v = document.getElementById('view');
  if (rv.i >= rv.items.length) {
    v.innerHTML = `<div class="card" style="text-align:center"><div class="rv-tag">Xong lượt ôn</div><div style="font-size:30px;font-family:var(--display);margin:10px 0">${rv.right} / ${rv.items.length} đúng</div><div class="meta" style="font-size:15px;margin-bottom:16px">Câu đúng 2 lần liên tiếp được tính là đã nắm. Câu sai sẽ quay lại trong lượt ôn sau.</div><button class="btn" onclick="load()">Xem tiến độ</button></div>`; return;
  }
  const e = rv.items[rv.i];
  let input;
  if (isMcq(e)) {
    const pool = [e.correct_answer, e.error_content].filter((x, k, a) => x && a.indexOf(x) === k);
    errs.forEach(o => { if (o.id !== e.id && isMcq(o) && pool.length < 4 && !pool.includes(o.error_content) && o.error_content && o.error_content !== '(blank)') pool.push(o.error_content); });
    pool.sort(() => Math.random() - 0.5);
    input = pool.map((p, k) => `<button class="opt" onclick="answer(${JSON.stringify(p).replace(/"/g, '&quot;')})">${esc(p)}</button>`).join('');
  } else {
    input = `<input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ đáp án của em" onkeydown="if(event.key==='Enter')answer(this.value)"><div style="margin-top:12px"><button class="btn" onclick="answer(document.getElementById('ans').value)">Kiểm tra</button></div>`;
  }
  v.innerHTML = `<div class="card"><div class="prog"><i style="width:${Math.round(rv.i / rv.items.length * 100)}%"></i></div>
    <div class="rv-tag">${esc(TYPE[e.error_type] || e.error_type)} · câu ${rv.i + 1}/${rv.items.length}</div><div class="rv-q">${esc(e.context || e.correct_answer)}</div>${input}<div id="fb"></div></div>`;
  const a = document.getElementById('ans'); if (a) a.focus();
}
async function answer(val) {
  if (rv.answered) return; rv.answered = true;
  const e = rv.items[rv.i], ok = sameA(val, e.correct_answer);
  const streak = ok ? (e.review_streak || 0) + 1 : 0, mastered = streak >= MASTER_AT;
  if (ok) rv.right++;
  const upd = { review_streak: streak, last_review: isoToday(), is_resolved: mastered, resolved_at: mastered ? new Date().toISOString() : null };
  const { error } = await fetch('/api/review-error', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ student_id: student.id, error_id: e.id, ...upd }) }).then(r => r.json()).then(j => j.ok ? { error: null } : { error: { message: j.error } }, err => ({ error: err }));
  Object.assign(e, upd);
  document.getElementById('fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}">${ok ? (mastered ? 'Đúng rồi! Em đã nắm câu này.' : `Đúng rồi! Thêm ${MASTER_AT - streak} lần đúng liên tiếp nữa là nắm.`) : `Chưa đúng. Đáp án: <b>${esc(e.correct_answer)}</b>`}${error ? '<br><small>(Chưa lưu được tiến độ: ' + esc(error.message) + ')</small>' : ''}</div><div id="vbox"></div><div style="margin-top:14px"><button class="btn" id="nextBtn" onclick="next()">Câu tiếp →</button></div>`;
  document.querySelectorAll('.opt').forEach(b => b.disabled = true);
  if (isSound(e)) setupVoice(e);
}
function next() { rv.i++; rv.answered = false; renderCard(); }

/* ---------- Luyện phát âm cho lỗi âm: đọc lại đáp án, AI nghe và nhận xét ---------- */
const isSound = e => ['pronunciation', 'listening'].includes(e.error_type) && !isMcq(e);
let recRef = null;
function setupVoice(e) {
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('vbox').innerHTML = `<div style="margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--soft)"><div class="rv-tag">Luyện phát âm</div><div style="margin:6px 0 12px;font-size:17px">Đọc to: <b>${esc(e.correct_answer)}</b></div><div id="vmsg" class="meta"></div><button class="btn" id="recBtn" onclick="toggleRec()">🎙 Ghi âm</button></div>`;
}
async function toWav16k(blob) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const buf = await ctx.decodeAudioData(await blob.arrayBuffer());
  ctx.close();
  const off = new OfflineAudioContext(1, Math.ceil(buf.duration * 16000), 16000);
  const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start();
  const pcm = (await off.startRendering()).getChannelData(0);
  let peak = 0; for (const v of pcm) peak = Math.max(peak, Math.abs(v));
  const data = new DataView(new ArrayBuffer(44 + pcm.length * 2)), put = (o, s) => { for (let i = 0; i < s.length; i++) data.setUint8(o + i, s.charCodeAt(i)); };
  put(0, 'RIFF'); data.setUint32(4, 36 + pcm.length * 2, true); put(8, 'WAVE'); put(12, 'fmt ');
  data.setUint32(16, 16, true); data.setUint16(20, 1, true); data.setUint16(22, 1, true); data.setUint32(24, 16000, true);
  data.setUint32(28, 32000, true); data.setUint16(32, 2, true); data.setUint16(34, 16, true); put(36, 'data'); data.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++) { const s = Math.max(-1, Math.min(1, pcm[i])); data.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  return { wav: new Blob([data.buffer], { type: 'audio/wav' }), seconds: pcm.length / 16000, peak };
}
async function blobToB64(blob) {
  const u = new Uint8Array(await blob.arrayBuffer()); let s = '';
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
}
async function toggleRec() {
  if (recRef) { recRef.stop(); return; }
  const btn = document.getElementById('recBtn'), msg = document.getElementById('vmsg'), e = rv.items[rv.i];
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (err) { msg.textContent = 'Không dùng được micro: ' + err.message; return; }
  const chunks = [], rec = new MediaRecorder(stream, MediaRecorder.isTypeSupported('audio/webm') ? { mimeType: 'audio/webm' } : undefined);
  let tmr = null;
  rec.ondataavailable = ev => { if (ev.data.size) chunks.push(ev.data); };
  rec.onstop = async () => {
    clearTimeout(tmr); stream.getTracks().forEach(t => t.stop()); recRef = null;
    btn.textContent = '🎙 Ghi âm lại';
    await submitVoice(new Blob(chunks, { type: rec.mimeType || 'audio/webm' }), e);
  };
  recRef = rec; rec.start();
  btn.textContent = '⏹ Dừng'; msg.textContent = 'Đang ghi… tự dừng sau 12 giây.';
  tmr = setTimeout(() => { if (rec.state !== 'inactive') rec.stop(); }, 12000);
}
async function submitVoice(blob, e) {
  const msg = document.getElementById('vmsg'), btn = document.getElementById('recBtn');
  if (!msg) return;
  msg.textContent = 'Đang xử lý và nhờ AI nghe…'; btn.disabled = true;
  try {
    const { wav, seconds, peak } = await toWav16k(blob);
    if (seconds < 0.6) throw new Error('Đọc dài hơn chút nhé.');
    if (peak < 0.02) throw new Error('Âm thanh quá nhỏ. Đưa micro gần miệng hơn rồi ghi lại.');
    const r = await fetch('/api/error-voice', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ student_id: student.id, error_id: e.id, audio: await blobToB64(wav) }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Lỗi không rõ');
    const extra = j.problems && j.problems.length ? '<br>• ' + j.problems.map(esc).join('<br>• ') : '';
    if (j.verdict === 'ok') {
      msg.innerHTML = `<div class="fb ok">✓ Phát âm ổn rồi! ${esc(j.feedback)}${extra}</div>`;
      btn.style.display = 'none'; document.getElementById('nextBtn').disabled = false;
    } else {
      msg.innerHTML = `<div class="fb no">Chưa ổn, em ghi lại nhé. ${esc(j.feedback)}${extra}</div>`;
      btn.style.display = ''; btn.textContent = '🎙 Ghi âm lại';
    }
  } catch (err) {
    msg.innerHTML = `<div class="fb no">${esc(err.message)}</div>`;
    btn.style.display = ''; btn.textContent = '🎙 Ghi âm lại';
  } finally { btn.disabled = false; }
}
</script>
</body>
</html>
